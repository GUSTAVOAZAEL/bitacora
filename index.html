<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bitácora de salud</title>
<meta name="description" content="Bitácora personal de alimentación, gym, sueño, agua, suplementos, ánimo y pulso. Funciona sin internet.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#EDF2F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1717" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: una columna tipo libreta de gym. Hoy abre con macros y botella de agua, luego la cuadrícula de captura. Cada captura abre una hoja inferior con tarjetas. */
:root{
  --bg:#EDF2F1;--surface:#F8FBFA;--fg:#10201F;--muted:#566B69;--line:#D2DEDC;
  --accent:#0B7A75;--accent-ink:#FFFFFF;--soft:#DCEBE8;--warn:#B4540A;--ok:#1E8E3E;--ok-ink:#FFFFFF;--bad:#C62828;
  --c-p:#0B7A75;--c-c:#B7791F;--c-g:#B4533C;--water:#2F78C4;
  --display:"Avenir Next Condensed","Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:-apple-system,system-ui,"SF Pro Text","Segoe UI",Barlow,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"IBM Plex Mono",monospace;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1717;--surface:#152221;--fg:#E6F0EE;--muted:#8FA7A4;--line:#263A38;
  --accent:#3FC1B8;--accent-ink:#04201E;--soft:#1C3330;--warn:#F0A060;--ok:#4CC46A;--ok-ink:#06210E;--bad:#FF6B6B;
  --c-p:#3FC1B8;--c-c:#E3B04B;--c-g:#E88A72;--water:#5BA7EE;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1717;--surface:#152221;--fg:#E6F0EE;--muted:#8FA7A4;--line:#263A38;
  --accent:#3FC1B8;--accent-ink:#04201E;--soft:#1C3330;--warn:#F0A060;--ok:#4CC46A;--ok-ink:#06210E;--bad:#FF6B6B;
  --c-p:#3FC1B8;--c-c:#E3B04B;--c-g:#E88A72;--water:#5BA7EE;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);
  padding-block:8px 100px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.wrap>*{min-width:0}
h1{font:600 32px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0}
h2{font:600 20px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:0}
h3{font:600 17px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:0}
p{margin:0}
.emo{font-family:var(--emoji);font-style:normal;line-height:1}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.headr{display:flex;align-items:flex-end;gap:8px;flex:none}
#monito{width:140px;height:50px;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.head.g #monito{width:112px;height:40px}
@media (max-width:370px){#monito{width:140px;height:50px}.head.g #monito{width:98px;height:35px}}
.wbtn{width:40px;height:40px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:0}
.wbtn svg{width:20px;height:20px}
.wbtn.spin svg{animation:spin .8s ease-in-out}
@keyframes spin{to{transform:rotate(360deg)}}
.gear{width:44px;height:44px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.gear svg{width:24px;height:24px}
.thg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.th{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:14px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.th.on{box-shadow:inset 0 0 0 2px var(--accent);border-color:var(--accent)}
.th .mk{border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;height:74px}
.th .mk i{display:block;border-radius:6px}
.th b{font-weight:600;font-size:15px}
.th .sub{font-size:12px;line-height:1.3}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.swb{display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;border:0;color:var(--fg);font:500 11px var(--body);padding:0;width:58px;cursor:pointer}
.swb span.c{width:44px;height:44px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.swb.on span.c{box-shadow:0 0 0 2.5px var(--accent)}
.date{font:500 12px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.k{display:block;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.v{display:block;font:600 36px/1.05 var(--display);font-variant-numeric:tabular-nums}
.v small{font:500 14px var(--body);color:var(--muted);margin-left:4px}
.sub{color:var(--muted);font-size:14px}
.mono{font-family:var(--mono)}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}

button{cursor:pointer}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;min-height:48px;padding:0 18px;font:600 17px var(--display);letter-spacing:.06em;text-transform:uppercase}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 16px;font:600 16px var(--display);letter-spacing:.05em;text-transform:uppercase}
.danger{color:var(--warn);border-color:var(--warn)}
.small{min-height:40px;font-size:15px;padding:0 14px}
.full{width:100%}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{min-height:84px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:600 14px var(--display);letter-spacing:.04em;text-transform:uppercase;padding:6px 2px}
.tile svg{width:26px;height:26px;color:var(--accent)}
.tile:active{background:var(--soft)}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.notice{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.notice.warn{border-color:var(--warn)}
.notice .row{display:flex;gap:8px;flex-wrap:wrap}

.list{display:flex;flex-direction:column}
.ent{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.ent:first-child{border-top:0}
.ent svg{width:22px;height:22px;color:var(--accent);margin-top:2px}
.ent .emo{font-size:22px;margin-top:1px}
.ent b{font-weight:600}
.ent .t{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.ent .sub{overflow-wrap:anywhere}
.del{margin-top:4px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;min-height:32px;padding:0 10px;font:500 12px var(--mono)}
.del.arm{border-color:var(--warn);color:var(--warn)}
.col{display:flex;flex-direction:column;align-items:flex-end}
.col .acts{display:flex;flex-direction:column;gap:4px;align-items:stretch;margin-top:2px}
.col .acts .del{margin-top:0;min-width:64px}
.elist{display:flex;flex-direction:column;gap:1px;margin:3px 0 2px;font-size:14px;color:var(--muted);line-height:1.3}
.elist b{font:600 12px var(--mono);color:var(--fg);margin-right:6px}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:500 16px var(--body)}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:18px;font:500 14px var(--body)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.dash{border-style:dashed;color:var(--muted)}

.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span:first-child,.glabel{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inp{display:flex;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 12px;min-height:48px}
.inp:focus-within{outline:3px solid var(--accent);outline-offset:1px}
.inp input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--fg);font:500 18px var(--mono);outline:0}
.inp input[type=text]{font:500 17px var(--body)}
.inp input[type=time]{font:500 17px var(--mono)}
.inp input[type=date]{font:500 16px var(--mono)}
.inp.off{opacity:.45}
.inp.calc{background:var(--soft);border-style:dashed}
.inp input:disabled{color:var(--fg);-webkit-text-fill-color:var(--fg);opacity:1}
.inp em{font:500 13px var(--mono);color:var(--muted);font-style:normal;margin-left:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
details{border:1px solid var(--line);border-radius:10px;padding:0 12px 12px}
summary{min-height:44px;display:flex;align-items:center;font:600 16px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.err{color:var(--warn);font-weight:500}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions>*{flex:1 1 140px}
textarea{width:100%;min-height:120px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:10px 12px;font:400 16px/1.4 var(--mono);resize:vertical}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}

/* tarjetas */
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ci{position:relative;border:1px solid var(--line);background:var(--bg);border-radius:14px;overflow:hidden;min-width:0}
.ci-main{width:100%;height:100%;display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:12px;background:transparent;border:0;color:var(--fg);text-align:left;min-height:124px}
.ci-main:active{background:var(--soft)}
.ci-media{width:100%;height:52px;display:flex;align-items:center;font-size:38px;line-height:1}
.ci-media img{height:52px;width:calc(100% - 44px);object-fit:cover;border-radius:10px}
.ci b{font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.ci .sub{font-size:12px;overflow-wrap:anywhere}
.ci-media{padding-right:42px;overflow:hidden}
.ci .ilist{display:flex;flex-direction:column;gap:2px;width:100%;font-size:13px;color:var(--muted);line-height:1.25}
.ci .ilist span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .ilist b{font:600 12px var(--mono);color:var(--fg);margin-right:5px}
.ci .ilist i{font:500 11px var(--mono);font-style:normal}
.ci .ings{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
/* vista previa de comida */
.pv{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.pv-h{display:flex;align-items:center;gap:12px}
.pv-h .big{min-width:72px;width:auto;padding:0 8px;height:72px;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden;flex:none}
.pv-h .big img{width:100%;height:100%;object-fit:cover}
.pv-h h2{overflow-wrap:anywhere}
.pvr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pvr:first-child{border-top:0}
.pvr b{font-weight:600;overflow-wrap:anywhere}
.pvr .q{font:600 17px var(--mono);font-variant-numeric:tabular-nums}
.pvm{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;border-top:1px solid var(--line);padding-top:10px}
.pvm div{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.pvm .v{font-size:26px}
.pvm .p .v{color:var(--c-p)}.pvm .c .v{color:var(--c-c)}.pvm .g .v{color:var(--c-g)}
/* pendientes de hoy */
.chk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;border-top:1px solid var(--line);padding-top:10px}
.ck2{min-height:44px;border:1.5px dashed var(--line);background:transparent;color:var(--muted);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:4px;font:600 min(13px,3.15vw) var(--display);letter-spacing:0;white-space:nowrap;text-transform:uppercase;padding:0 2px;min-width:0;overflow:hidden}
.ck2 svg{width:22px;height:22px;flex:none}
.ck2:active{transform:scale(.97)}
.tap{cursor:pointer;border-radius:14px;margin:-6px;padding:6px;transition:background .15s}
.tap:active{background:var(--soft)}
.tap:focus-visible{outline:3px solid var(--accent)}
.taphint{font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.wcol .taphint{margin-bottom:2px}
.pbtn{width:100%;background:transparent;border:0;border-top:1px solid var(--line);color:var(--fg);text-align:left;font:inherit;cursor:pointer}
.pbtn:first-child{border-top:0}
.pbtn:active{background:var(--soft)}
.pbtn svg{width:20px;height:20px;color:var(--muted)}
.ing .tb{opacity:.75;font-size:11px}
.ck2.ok{background:var(--ok);border:1px solid var(--ok);color:var(--ok-ink)}
.ck2.part{border:1.5px solid var(--ok);color:var(--ok)}
.ci-edit{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.ci-edit svg{width:18px;height:18px}
.ci.add .ci-main{align-items:center;justify-content:center;text-align:center;border:1px dashed var(--muted);border-radius:14px;color:var(--muted);font:600 16px var(--display);letter-spacing:.05em;text-transform:uppercase}
.ci.add svg{width:28px;height:28px}
.cnt{font:500 11px var(--mono);color:var(--accent)}
.daybar{display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--line);border-radius:12px}
.daybar.past{border-color:var(--accent);background:var(--soft)}
.daybar .seg button{flex:0 0 auto;min-width:64px}
.daybar .inp{min-height:44px}
.daybar .sub{margin:0}
.mini{font:500 12px var(--mono);color:var(--muted);letter-spacing:.03em}

.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.moods.m4{grid-template-columns:repeat(4,1fr)}
.mood{min-height:82px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:600 12px var(--display);letter-spacing:.04em;text-transform:uppercase;padding:4px 2px}
.mood .emo{font-size:30px}
.mood.on{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 2px var(--accent)}
.epick{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.epick button{height:42px;font-size:22px;font-family:var(--emoji);border:1px solid transparent;border-radius:8px;background:transparent;padding:0}
.epick button.on{border-color:var(--accent);background:var(--soft)}
.prev{display:flex;align-items:center;gap:12px}
.idrow{display:flex;gap:12px;align-items:flex-end}
.idrow>div{flex:1;min-width:0}
.emo-box{min-width:68px;height:68px;padding:0 6px;border:1px dashed var(--line);border-radius:16px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:36px}
.emos{display:inline-flex;align-items:center;white-space:nowrap;line-height:1}
.emos .emo{font-size:1em}
.emos.n2 .emo{font-size:.84em}.emos.n3 .emo{font-size:.7em}.emos.n4 .emo{font-size:.6em}
.emos .more{font:600 15px var(--mono);color:var(--muted);margin-left:4px}
.pe{font-family:var(--emoji);margin-right:6px;font-weight:400}
.emo-in{width:68px;height:68px;flex:none;display:block;border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--fg);font:38px/1 var(--emoji);text-align:center;padding:0;caret-color:transparent;cursor:pointer}
.emo-in:focus{outline:3px solid var(--accent);outline-offset:1px}
.prev .big{width:64px;height:64px;border-radius:14px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden;flex:none}
.prev .big img{width:100%;height:100%;object-fit:cover}

/* gym */
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 104px 48px;gap:6px;align-items:center}
.mt{min-height:48px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);padding:0 10px;font-weight:500;font-size:15px;display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere;line-height:1.15}
.sv{width:48px;height:48px;border-radius:10px;border:1.5px dashed var(--muted);background:var(--bg);color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.sv svg{width:24px;height:24px}
.sv.ok{background:var(--ok);border:1.5px solid var(--ok);color:var(--ok-ink)}
.sv:disabled{opacity:.35}
.mrow.done .mt{border-color:var(--ok)}
.mrow .inp{padding:0 8px}
.mrow .inp input{font-size:17px}
.mrow .inp em{margin-left:2px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.gcnt{display:flex;justify-content:space-between;align-items:center;gap:8px;font:500 12px var(--mono);color:var(--muted)}
.gcnt b{color:var(--ok);font-weight:600}
/* productos */
.ing{display:grid;grid-template-columns:minmax(0,1fr) 108px 40px;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.ing:first-child{border-top:0}
.ing .nm{font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.ing .inp{min-height:44px;padding:0 8px}
.ing .x{width:40px;height:40px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;font-size:18px;padding:0}
.ingtot{display:flex;flex-wrap:wrap;gap:4px 12px;font:500 13px var(--mono);padding:8px 10px;border-radius:10px;background:var(--soft)}
.pbox{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.mt.on{background:var(--soft);border-color:var(--accent)}
.mt .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center;color:var(--accent-ink);font-size:13px;line-height:1}
.mt.on .ck{background:var(--accent);border-color:var(--accent)}
.mt.on .ck::after{content:"✓"}
.addrow{display:flex;gap:8px;align-items:center}
.addrow .inp{flex:1}

/* resumen de hoy */

function seed(){
 var s=11,rnd=function(){s=(s*16807)%2147483647;return (s-1)/2147483646};

 var out=[],nowH=hourNow(),lib={};db.lib.forEach(function(i){lib[i.id]=i});
 function mk(off,h,m,o){
  if(off===0&&h>nowH)return;

  o.id=uid()+out.length;o.ts=d.toISOString();o.ex=true;out.push(o);
 }
 function meal(off,h,momento,id){var i=lib[id];mk(off,h,15,{type:'comida',momento:momento,nombre:i.nombre,cant:i.cant,kcal:i.kcal,p:i.p,c:i.c,g:i.g,porc:1,emoji:i.emoji,lib:id})}
 var cycle=['Pecho','Espalda','Pierna','Descanso'];
 var base={'Pecho':50,'Dorsal':45,'Espalda media':40,'Trapecio':30,'Espalda baja':35,'Cuádriceps':80,'Isquiotibiales':50,'Glúteo':60,'Pantorrilla':70,'Bíceps largo':12,'Bíceps corto':10,'Tríceps largo':20,'Tríceps medio':25,'Tríceps lateral':15};
 var sets={Pecho:['Pecho','Tríceps largo','Tríceps medio','Tríceps lateral'],Espalda:['Dorsal','Espalda media','Trapecio','Bíceps largo','Bíceps corto'],Pierna:['Cuádriceps','Isquiotibiales','Glúteo','Pantorrilla']};
 for(var off=10;off>=0;off--){
  var idx=10-off,rut=cycle[idx%4],ci=Math.floor(idx/4);
  [[8,0,250],[11,30,500],[15,0,330],[18,30,750],[21,0,500]].forEach(function(a){if(rnd()>.15)mk(off,a[0],a[1],{type:'agua',ml:a[2]})});
  meal(off,8,'Desayuno',pick(['x_avena','x_huevo','x_batido']));
  meal(off,14,'Comida',pick(['x_pollo','x_carne']));
  meal(off,20,'Cena',pick(['x_atun','x_carne']));
  if(rnd()>.4)meal(off,17,'Snack',pick(['x_yogur','x_batido']));
  var dur=pick([6.5,7,7.5,8]),fin=new Date();fin.setDate(fin.getDate()-off);fin.setHours(6,30,0,0);
  if(!(off===0&&nowH<7)){out.push({id:uid()+out.length,type:'sueno',h:dur,ini:new Date(fin.getTime()-dur*3600000).toISOString(),fin:fin.toISOString(),ts:fin.toISOString(),bloque:'Noche',ex:true})}
  if(rnd()>.75&&!(off===0&&nowH<17)){var nf=new Date();nf.setDate(nf.getDate()-off);nf.setHours(16,0,0,0);out.push({id:uid()+out.length,type:'sueno',h:1,ini:new Date(nf.getTime()-3600000).toISOString(),fin:nf.toISOString(),ts:nf.toISOString(),bloque:'Siesta',ex:true})}
  mk(off,8,5,{type:'suple',item:'Creatina',emoji:'🧪',momento:'Mañana'});
  mk(off,9,0,{type:'suple',item:'Café',emoji:'☕',momento:'Mañana'});
  if(rut!=='Descanso'){
   var pesos={};sets[rut].forEach(function(m){pesos[m]=base[m]+ci*2.5+(rnd()>.6?2.5:0)});
   mk(off,17,30,{type:'gym',rutina:rut,horario:'Tarde',pesos:pesos,animoGym:2+Math.floor(rnd()*3)});
  } else mk(off,18,0,{type:'gym',rutina:'Descanso',horario:'Tarde',pesos:{}});
  mk(off,22,0,{type:'animo',nivel:3+Math.floor(rnd()*3),tags:[pick(TAGS0)],nota:''});
  mk(off,22,5,{type:'pulso',reposo:58+Math.floor(rnd()*6),prom:72+Math.floor(rnd()*10),max:140+Math.floor(rnd()*30)});
  if(off===4)mk(off,19,0,{type:'molestia',tipo:'Digestivo',nombre:'Pesadez',emoji:'😮‍💨',zona:'Pesadez',int:2});
  if(off===7)mk(off,19,0,{type:'molestia',tipo:'Físico',nombre:'Articulación',emoji:'🦴',zona:'Hombro derecho',int:3});
 }
 db.entries=db.entries.concat(out);db.seeded=true;persist();
}

ts[i][1]));\n  p.closeSubpath();\n  return p;\n}\n\nfunction bottleImage(ml, goal) {\n  const dc = new DrawContext();\n  dc.size = new Size(80, 202); dc.opaque = false; dc.respectScreenScale = true;\n  const pts = bottlePoints();\n  dc.addPath(polyPath(pts)); dc.setFillColor(BT.soft); dc.fillPath();\n  const pct = goal > 0 ? Math.min(1, ml / goal) : 0;\n  if (pct > 0) {\n    const level = 196 - pct * 170;\n    const wp = clipBelow(pts, level);\n    if (wp.length > 2) { dc.addPath(polyPath(wp)); dc.setFillColor(col(BT.water)); dc.fillPath(); }\n  }\n  const n = Math.round(goal / 500);\n  if (n >= 1 && n <= 12) {\n    for (let k = 1; k < n; k++) {\n      const y = 196 - (k * 500 / goal) * 170;\n      const tp = new Path(); tp.move(new Point(58, y)); tp.addLine(new Point(72, y));\n      dc.addPath(tp); dc.setStrokeColor(BT.tick); dc.setLineWidth(1.5); dc.strokePath();\n    }\n  }\n  dc.addPath(polyPath(pts)); dc.setStrokeColor(col(BT.line)); dc.setLineWidth(3); dc.strokePath();\n  return dc.getImage();\n}\n\n// ---------- widget ----------\nconst w = new ListWidget();\nw.backgroundColor = dyn(\"bg\");\nw.setPadding(16, 16, 14, 16);\nw.refreshAfterDate = new Date(Date.now() + 15 * 60 * 1000);\n\nif (!D) {\n  const t = w.addText(\"Bitácora\");\n  t.font = Font.boldSystemFont(20); t.textColor = dyn(\"fg\");\n  w.addSpacer(6);\n  const s = w.addText(\"Abre la Bitácora y toca “↻ Widget” para cargar tu resumen de hoy.\");\n  s.font = Font.systemFont(13); s.textColor = dyn(\"muted\");\n} else {\n  const G = D.G || {};\n  const fresh = D.f === todayKey();\n  let label = \"Hoy\";\n  if (!fresh) {\n    const p = String(D.f || \"\").split(\"-\");\n    label = p.length === 3 ? \"Datos del \" + (+p[2]) + \" \" + MES[(+p[1]) - 1] : \"Sin actualizar\";\n  }\n\n  // encabezado\n  const head = w.addStack(); head.centerAlignContent();\n  const h1 = head.addText(label); h1.font = Font.boldSystemFont(20); h1.textColor = dyn(fresh ? \"fg\" : \"warn\");\n  head.addSpacer();\n  const h2 = head.addText(fresh ? \"Actualizado \" + D.t : \"Abre la Bitácora y actualiza\");\n  h2.font = Font.mediumMonospacedSystemFont(11); h2.textColor = dyn(fresh ? \"muted\" : \"warn\");\n  w.addSpacer(10);\n\n  const body = w.addStack(); body.layoutHorizontally();\n\n  // columna del agua\n  const left = body.addStack(); left.layoutVertically(); left.centerAlignContent();\n  const bi = left.addImage(bottleImage(D.ml || 0, G.ml || 3000));\n  bi.imageSize = new Size(88, 222);\n  left.addSpacer(6);\n  const mv = left.addText(num(D.ml || 0)); mv.font = Font.boldSystemFont(24); mv.textColor = dyn(\"fg\");\n  const mg = left.addText(\"de \" + num(G.ml || 0) + \" ml\"); mg.font = Font.mediumMonospacedSystemFont(10); mg.textColor = dyn(\"muted\");\n  const rem = Math.round((G.ml || 0) - (D.ml || 0));\n  const mr = left.addText(rem > 0 ? \"Faltan \" + num(rem) : \"Meta cumplida\"); mr.font = Font.systemFont(11); mr.textColor = dyn(\"muted\");\n\n  body.addSpacer(16);\n\n  // columna de macros\n  const right = body.addStack(); right.layoutVertically();\n  const rows = [\n    [\"Proteína\", D.p || 0, G.p || 0, \"g\", \"p\"],\n    [\"Carbohidratos\", D.c || 0, G.c || 0, \"g\", \"c\"],\n    [\"Grasa\", D.g || 0, G.g || 0, \"g\", \"g\"],\n    [\"Calorías\", D.k || 0, G.k || 0, \"kcal\", (D.k || 0) > (G.k || 0) ? \"warn\" : \"fg\"],\n  ];\n  rows.forEach((r, i) => {\n    const name = r[0], val = r[1], goal = r[2], unit = r[3], color = r[4];\n    const top = right.addStack(); top.centerAlignContent();\n    const nt = top.addText(name); nt.font = Font.semiboldSystemFont(i === 0 ? 15 : 13); nt.textColor = dyn(\"fg\");\n    top.addSpacer();\n    const vt = top.addText(num(val) + \" / \" + num(goal)); vt.font = Font.mediumMonospacedSystemFont(11); vt.textColor = dyn(\"muted\");\n    right.addSpacer(4);\n    barStack(right, 190, i === 0 ? 11 : 8, goal > 0 ? val / goal : 0, color);\n    right.addSpacer(3);\n    const r2 = Math.round(goal - val);\n    const st = right.addText(r2 > 0 ? \"Faltan \ /* productos: tablas nutrimentales */
function findProd(id){return findLib(db.prods,id)}
function r1(v){return Math.round(v*10)/10}
function prodCalc(pr,cant){var q=numv(cant),o={kcal:0,p:0,c:0,g:0};if(!pr||!(q>0)||!(pr.base>0))return o;var f=q/pr.base;['kcal','p','c','g'].forEach(function(k){if(pr[k]!=null)o[k]=pr[k]*f});return o}
function useIngs(d){return !!(d&&d.ings&&d.ings.length&&d.ings.every(function(i){return findProd(i.pid)}))}
function ingTotals(ings){var t={kcal:0,p:0,c:0,g:0};(ings||[]).forEach(function(i){var r=prodCalc(findProd(i.pid),i.cant);['kcal','p','c','g'].forEach(function(k){t[k]+=r[k]})});return t}
function syncIngs(d){if(!useIngs(d))return;var t=ingTotals(d.ings);d.kcal=Math.round(t.kcal);d.p=r1(t.p);d.c=r1(t.c);d.g=r1(t.g)}
function macroLine(r){return fmt(Math.round(r.kcal))+' kcal · P '+fmt(r1(r.p))+' · C '+fmt(r1(r.c))+' · G '+fmt(r1(r.g))}
function ingLine(pr,cant){if(!pr)return 'ya no está en tu catálogo';if(!(numv(cant)>0))return 'escribe '+cuantos(pr.unidad)+' usas';return macroLine(prodCalc(pr,cant))}
function baseLabel(pr){return pr.unidad==='unid'?(+pr.base===1?'1 unidad':fmt(pr.base)+' unidades'):fmt(pr.base)+' '+pr.unidad}
function prodSub(pr){var nb=function(t){return t.replace(/ /g,'\u00a0')};return [baseLabel(pr),fmt(pr.kcal||0)+' kcal','P '+fmt(pr.p||0),'C '+fmt(pr.c||0),'G '+fmt(pr.g||0)].map(nb).join(' · ')}
function npDraft(pr){pr=pr||{};var nv=function(v){return v==null?'':v};return {id:pr.id||null,emoji:pr.emoji||'',nombre:pr.nombre||'',base:pr.base||100,unidad:pr.unidad||'g',kcal:nv(pr.kcal),p:nv(pr.p),c:nv(pr.c),g:nv(pr.g),confirm:false}}
function uName(u){return u==='g'?'gramos':u==='ml'?'ml':'unidades'}
function cuantos(u){return u==='unid'?'cuántas unidades':'cuántos '+uName(u)}
function prodForm(path,np){
 return '<div class="pbox"><h3>'+(np.id?'Editar producto':'Nuevo producto')+'</h3>'+iconRow(np,path+'.emoji',path+'.nombre','Granola')+
  '<div class="grid2">'+fld(path+'.base','La tabla viene por',{unit:np.unidad,ph:'100'})+'<div class="fld"><span>Unidad</span>'+segB(path+'.unidad',[['g','g'],['ml','ml'],['unid','unidades']],np.unidad)+'</div></div>'+
  '<div class="grid2">'+fld(path+'.kcal','Calorías',{unit:'kcal',ph:'auto'})+fld(path+'.p','Proteína',{unit:'g'})+fld(path+'.c','Carbohidratos',{unit:'g'})+fld(path+'.g','Grasa',{unit:'g'})+'</div>'+
  '<p class="sub">Copia los números tal como vienen en la etiqueta para esa porción. Si dejas las calorías vacías, se calculan con los macros.</p>'+
  '</div>';
}
function prodFromDraft(np){
 var nm=(np.nombre||'').trim(),b=numv(np.base),p=numv(np.p),c=numv(np.c),g=numv(np.g),k=numv(np.kcal);
 if(!nm)return {err:'Escribe el nombre del producto.'};
 if(!(b>0))return {err:'Escribe la porción de la tabla, por ejemplo 100.'};
 if(k==null&&(p!=null||c!=null||g!=null))k=Math.round(4*(p||0)+4*(c||0)+9*(g||0));
 if(k==null)return {err:'Escribe las calorías o al menos un macro del producto.'};
 return {item:{emoji:String(np.emoji||'').trim(),nombre:nm,base:b,unidad:['g','ml','unid'].indexOf(np.unidad)>-1?np.unidad:'g',kcal:k,p:p,c:c,g:g}};
}
function upsertProd(np){
 var r=prodFromDraft(np);if(r.err)return r;
 var cur=np.id&&findProd(np.id);
 if(cur)Object.assign(cur,r.item);else{cur=Object.assign({id:uid()},r.item);db.prods.push(cur)}
 db.lib.forEach(function(i){if(i.ings&&i.ings.some(function(x){return x.pid===cur.id})&&useIngs(i)){var t=ingTotals(i.ings);i.kcal=Math.round(t.kcal);i.p=r1(t.p);i.c=r1(t.c);i.g=r1(t.g)}});
 persist();return {prod:cur};
}

   '<button type="button" class="x" data-ingdel="'+n+'" aria-label="Quitar '+esc(pr?pr.nombre:'producto')+'">×</button></div>'}).join('');
 var pick='<button type="button" class="ghost small" data-act="pickon" style="align-self:flex-start">+ Agregar producto</button>',tot='';
 return '<div class="stack" style="gap:8px"><span class="glabel">Productos y cantidades</span>'+
  (rows?'<div>'+rows+'</div>'+tot:'<p class="sub">Agrega productos de tu catálogo, escribe cuánto usas y los macros se calculan solos.</p>')+pick+'</div>';
}

function updIngs(){
 var d=SH&&SH.st&&SH.st.ed;if(!d||!d.ings)return;syncIngs(d);
 d.ings.forEach(function(i,n){var el=$('#ingk_'+n);if(el)el.textContent=ingLine(findProd(i.pid),i.cant)});

}

function per100(pr,k){return pr.kcal>0&&pr[k]!=null?pr[k]/pr.kcal*100:null}

 q:'Por cantidad: cuánto trae en la misma cantidad de comida. Sirve para saber qué llena más de ese macro con un plato del mismo tamaño.',

function baseSeg(key,cur,m){

 var lib=e.lib&&findLib(db.lib,e.lib),p=e.porc||1;

 return out}
function recentComidas(momento){
 if(!momento)return recentAll();
 function collect(filter){var seen={},out=[];sorted().forEach(function(e){
  if(e.type!=='comida'||!e.nombre||seen[e.nombre]||out.length>=4)return;if(filter&&e.momento!==momento)return;seen[e.nombre]=1;
  var lib=e.lib&&findLib(db.lib,e.lib),p=e.porc||1;
  if(lib){out.push(Object.assign({},lib));return}
  out.push({id:lib?lib.id:null,nombre:e.nombre,cant:e.cant||'',emoji:e.emoji||(lib&&lib.emoji)||'🍽️',photo:lib?lib.photo:'',momentos:lib?lib.momentos:[e.momento],
   kcal:e.kcal!=null?e.kcal/p:null,p:e.p!=null?e.p/p:null,c:e.c!=null?e.c/p:null,g:e.g!=null?e.g/p:null})});return out}
 var r=collect(true);return r.length?r:collect(false);
}
function recentMolest(){
 var seen={},out=[];sorted().forEach(function(e){
  if(e.type!=='molestia'||out.length>=4)return;var nm=e.nombre||e.zona;if(!nm)return;var key=e.tipo+'|'+nm;if(seen[key])return;seen[key]=1;
