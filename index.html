<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bitácora de salud</title>
<meta name="description" content="Bitácora personal de alimentación, gym, sueño, agua, suplementos, ánimo y pulso. Funciona sin internet.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#EDF2F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1717" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: una columna tipo libreta de gym. Hoy abre con macros y botella de agua, luego la cuadrícula de captura. Cada captura abre una hoja inferior con tarjetas. */
:root{
  --bg:#EDF2F1;--surface:#F8FBFA;--fg:#10201F;--muted:#566B69;--line:#D2DEDC;
  --accent:#0B7A75;--accent-ink:#FFFFFF;--soft:#DCEBE8;--warn:#B4540A;--ok:#1E8E3E;--ok-ink:#FFFFFF;
  --c-p:#0B7A75;--c-c:#B7791F;--c-g:#B4533C;--water:#2F78C4;
  --display:"Avenir Next Condensed","Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:-apple-system,system-ui,"SF Pro Text","Segoe UI",Barlow,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"IBM Plex Mono",monospace;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1717;--surface:#152221;--fg:#E6F0EE;--muted:#8FA7A4;--line:#263A38;
  --accent:#3FC1B8;--accent-ink:#04201E;--soft:#1C3330;--warn:#F0A060;--ok:#4CC46A;--ok-ink:#06210E;
  --c-p:#3FC1B8;--c-c:#E3B04B;--c-g:#E88A72;--water:#5BA7EE;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1717;--surface:#152221;--fg:#E6F0EE;--muted:#8FA7A4;--line:#263A38;
  --accent:#3FC1B8;--accent-ink:#04201E;--soft:#1C3330;--warn:#F0A060;--ok:#4CC46A;--ok-ink:#06210E;
  --c-p:#3FC1B8;--c-c:#E3B04B;--c-g:#E88A72;--water:#5BA7EE;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);
  padding-block:14px 100px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.wrap>*{min-width:0}
h1{font:600 32px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0}
h2{font:600 20px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:0}
h3{font:600 17px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:0}
p{margin:0}
.emo{font-family:var(--emoji);font-style:normal;line-height:1}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.date{font:500 12px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.k{display:block;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.v{display:block;font:600 36px/1.05 var(--display);font-variant-numeric:tabular-nums}
.v small{font:500 14px var(--body);color:var(--muted);margin-left:4px}
.sub{color:var(--muted);font-size:14px}
.mono{font-family:var(--mono)}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}

button{cursor:pointer}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;min-height:48px;padding:0 18px;font:600 17px var(--display);letter-spacing:.06em;text-transform:uppercase}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 16px;font:600 16px var(--display);letter-spacing:.05em;text-transform:uppercase}
.danger{color:var(--warn);border-color:var(--warn)}
.small{min-height:40px;font-size:15px;padding:0 14px}
.full{width:100%}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{min-height:84px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:600 14px var(--display);letter-spacing:.04em;text-transform:uppercase;padding:6px 2px}
.tile svg{width:26px;height:26px;color:var(--accent)}
.tile:active{background:var(--soft)}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.notice{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.notice.warn{border-color:var(--warn)}
.notice .row{display:flex;gap:8px;flex-wrap:wrap}

.list{display:flex;flex-direction:column}
.ent{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.ent:first-child{border-top:0}
.ent svg{width:22px;height:22px;color:var(--accent);margin-top:2px}
.ent .emo{font-size:22px;margin-top:1px}
.ent b{font-weight:600}
.ent .t{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.ent .sub{overflow-wrap:anywhere}
.del{margin-top:4px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;min-height:32px;padding:0 10px;font:500 12px var(--mono)}
.del.arm{border-color:var(--warn);color:var(--warn)}
.col{display:flex;flex-direction:column;align-items:flex-end}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:500 16px var(--body)}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:18px;font:500 14px var(--body)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.dash{border-style:dashed;color:var(--muted)}

.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span:first-child,.glabel{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inp{display:flex;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 12px;min-height:48px}
.inp:focus-within{outline:3px solid var(--accent);outline-offset:1px}
.inp input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--fg);font:500 18px var(--mono);outline:0}
.inp input[type=text]{font:500 17px var(--body)}
.inp input[type=time]{font:500 17px var(--mono)}
.inp input[type=date]{font:500 16px var(--mono)}
.inp.off{opacity:.45}
.inp.calc{background:var(--soft);border-style:dashed}
.inp input:disabled{color:var(--fg);-webkit-text-fill-color:var(--fg);opacity:1}
.inp em{font:500 13px var(--mono);color:var(--muted);font-style:normal;margin-left:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
details{border:1px solid var(--line);border-radius:10px;padding:0 12px 12px}
summary{min-height:44px;display:flex;align-items:center;font:600 16px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.err{color:var(--warn);font-weight:500}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions>*{flex:1 1 140px}
textarea{width:100%;min-height:120px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:10px 12px;font:400 12px/1.4 var(--mono);resize:vertical}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}

/* tarjetas */
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ci{position:relative;border:1px solid var(--line);background:var(--bg);border-radius:14px;overflow:hidden;min-width:0}
.ci-main{width:100%;height:100%;display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:12px;background:transparent;border:0;color:var(--fg);text-align:left;min-height:124px}
.ci-main:active{background:var(--soft)}
.ci-media{width:100%;height:52px;display:flex;align-items:center;font-size:38px;line-height:1}
.ci-media img{height:52px;width:calc(100% - 44px);object-fit:cover;border-radius:10px}
.ci b{font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.ci .sub{font-size:12px;overflow-wrap:anywhere}
.ci .ings{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
/* vista previa de comida */
.pv{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.pv-h{display:flex;align-items:center;gap:12px}
.pv-h .big{width:72px;height:72px;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden;flex:none}
.pv-h .big img{width:100%;height:100%;object-fit:cover}
.pv-h h2{overflow-wrap:anywhere}
.pvr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pvr:first-child{border-top:0}
.pvr b{font-weight:600;overflow-wrap:anywhere}
.pvr .q{font:600 17px var(--mono);font-variant-numeric:tabular-nums}
.pvm{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;border-top:1px solid var(--line);padding-top:10px}
.pvm div{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.pvm .v{font-size:26px}
.pvm .p .v{color:var(--c-p)}.pvm .c .v{color:var(--c-c)}.pvm .g .v{color:var(--c-g)}
/* pendientes de hoy */
.chk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);padding-top:14px}
.ck2{min-height:56px;border:1.5px dashed var(--line);background:transparent;color:var(--muted);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:4px;font:600 min(13px,3.15vw) var(--display);letter-spacing:0;white-space:nowrap;text-transform:uppercase;padding:0 2px;min-width:0;overflow:hidden}
.ck2 svg{width:22px;height:22px;flex:none}
.ck2:active{transform:scale(.97)}
.tap{cursor:pointer;border-radius:14px;margin:-6px;padding:6px;transition:background .15s}
.tap:active{background:var(--soft)}
.tap:focus-visible{outline:3px solid var(--accent)}
.taphint{font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.wcol .taphint{margin-bottom:2px}
.pbtn{width:100%;background:transparent;border:0;border-top:1px solid var(--line);color:var(--fg);text-align:left;font:inherit;cursor:pointer}
.pbtn:first-child{border-top:0}
.pbtn:active{background:var(--soft)}
.pbtn svg{width:20px;height:20px;color:var(--muted)}
.ing .tb{opacity:.75;font-size:11px}
.ck2.ok{background:var(--ok);border:1px solid var(--ok);color:var(--ok-ink)}
.ck2.part{border:1.5px solid var(--ok);color:var(--ok)}
.ci-edit{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.ci-edit svg{width:18px;height:18px}
.ci.add .ci-main{align-items:center;justify-content:center;text-align:center;border:1px dashed var(--muted);border-radius:14px;color:var(--muted);font:600 16px var(--display);letter-spacing:.05em;text-transform:uppercase}
.ci.add svg{width:28px;height:28px}
.cnt{font:500 11px var(--mono);color:var(--accent)}
.daybar{display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--line);border-radius:12px}
.daybar.past{border-color:var(--accent);background:var(--soft)}
.daybar .seg button{flex:0 0 auto;min-width:64px}
.daybar .inp{min-height:44px}
.daybar .sub{margin:0}
.mini{font:500 12px var(--mono);color:var(--muted);letter-spacing:.03em}

.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.moods.m4{grid-template-columns:repeat(4,1fr)}
.mood{min-height:82px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:600 12px var(--display);letter-spacing:.04em;text-transform:uppercase;padding:4px 2px}
.mood .emo{font-size:30px}
.mood.on{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 2px var(--accent)}
.epick{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.epick button{height:42px;font-size:22px;font-family:var(--emoji);border:1px solid transparent;border-radius:8px;background:transparent;padding:0}
.epick button.on{border-color:var(--accent);background:var(--soft)}
.prev{display:flex;align-items:center;gap:12px}
.idrow{display:flex;gap:12px;align-items:flex-end}
.idrow>div{flex:1;min-width:0}
.emo-in{width:68px;height:68px;flex:none;display:block;border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--fg);font:38px/1 var(--emoji);text-align:center;padding:0;caret-color:transparent;cursor:pointer}
.emo-in:focus{outline:3px solid var(--accent);outline-offset:1px}
.prev .big{width:64px;height:64px;border-radius:14px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden;flex:none}
.prev .big img{width:100%;height:100%;object-fit:cover}

/* gym */
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 104px 48px;gap:6px;align-items:center}
.mt{min-height:48px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);padding:0 10px;font-weight:500;font-size:15px;display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere;line-height:1.15}
.sv{width:48px;height:48px;border-radius:10px;border:1.5px dashed var(--muted);background:var(--bg);color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.sv svg{width:24px;height:24px}
.sv.ok{background:var(--ok);border:1.5px solid var(--ok);color:var(--ok-ink)}
.sv:disabled{opacity:.35}
.mrow.done .mt{border-color:var(--ok)}
.mrow .inp{padding:0 8px}
.mrow .inp input{font-size:17px}
.mrow .inp em{margin-left:2px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.gcnt{display:flex;justify-content:space-between;align-items:center;gap:8px;font:500 12px var(--mono);color:var(--muted)}
.gcnt b{color:var(--ok);font-weight:600}
/* productos */
.ing{display:grid;grid-template-columns:minmax(0,1fr) 108px 40px;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.ing:first-child{border-top:0}
.ing .nm{font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.ing .inp{min-height:44px;padding:0 8px}
.ing .x{width:40px;height:40px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;font-size:18px;padding:0}
.ingtot{display:flex;flex-wrap:wrap;gap:4px 12px;font:500 13px var(--mono);padding:8px 10px;border-radius:10px;background:var(--soft)}
.pbox{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.mt.on{background:var(--soft);border-color:var(--accent)}
.mt .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center;color:var(--accent-ink);font-size:13px;line-height:1}
.mt.on .ck{background:var(--accent);border-color:var(--accent)}
.mt.on .ck::after{content:"✓"}
.addrow{display:flex;gap:8px;align-items:center}
.addrow .inp{flex:1}

/* resumen de hoy */
.macro{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.kring{width:132px;height:132px;flex:none}
.kring .trk{fill:none;stroke:var(--soft);stroke-width:12}
.kring .prg{fill:none;stroke:var(--fg);stroke-width:12;stroke-linecap:round}
.kring .prg.over{stroke:var(--warn)}
.kn{font:600 30px var(--display);fill:var(--fg);font-variant-numeric:tabular-nums}
.kl{font:500 8.5px var(--mono);fill:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.mbars{flex:1 1 180px;min-width:0;display:flex;flex-direction:column;gap:12px}
.mb{display:flex;flex-direction:column;gap:3px}
.mb-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mb .bar{margin-top:0;height:10px}
.mb .nm{font:600 15px var(--display);letter-spacing:.05em;text-transform:uppercase}
.mb.big .nm{font-size:21px}
.mb.big .bar{height:18px;border-radius:9px}
.mb.big .bar i{border-radius:9px}
.mb.p .bar i{background:var(--c-p)}
.mb.c .bar i{background:var(--c-c)}
.mb.g .bar i{background:var(--c-g)}
.mb.kc .bar i{background:var(--fg)}
.mb.kc.over .bar i{background:var(--warn)}
.mb.w .bar i{background:var(--water)}
.dp{display:flex;gap:16px;align-items:flex-start}
.wcol{width:100px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.wcol .bottle{width:72px}
.wcol .v{font-size:32px;margin-top:4px}
.wcol button{width:100%;padding:0 6px;margin-top:4px}
.dp .mbars{flex:1 1 0;min-width:0}
.mb-h{flex-wrap:wrap}
.mb-h .mono{font-size:12px}
.wrow{display:flex;gap:12px;align-items:center}
.wrow .mb{flex:1;min-width:0}
.wrow .bottle{width:34px}
.water{display:flex;gap:18px;align-items:center}
.bottle{width:80px;height:auto;flex:none}
.bottle .bg{fill:var(--soft)}
.bottle .fill{fill:var(--water)}
.bottle .out{fill:none;stroke:var(--muted);stroke-width:3}
.bottle .tick{stroke:var(--fg);stroke-width:1.5;opacity:.35}
.wtxt{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}

/* anillo de sueño */
#ring{width:100%;max-width:300px;height:auto;display:block;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
#ring .trk{fill:none;stroke:var(--soft);stroke-width:22}
#ring .oth{fill:none;stroke:var(--muted);stroke-width:22;opacity:.45}
#ring .sel path{fill:none;stroke-width:22}
#ring .tk{stroke:var(--muted);stroke-width:1.2}
#ring .tx{fill:var(--muted);font:500 10px var(--mono)}
#ring .hd{fill:var(--accent);stroke:var(--surface);stroke-width:3;cursor:grab}
#ring .hd2{fill:var(--surface);stroke:var(--accent);stroke-width:3.5;cursor:grab}
#ring .hg{font-family:var(--emoji);font-size:15px;pointer-events:none}
#ring .rd{font:600 34px var(--display);fill:var(--fg)}
#ring .rs{font:500 10px var(--mono);fill:var(--muted)}

#scrim{position:fixed;inset:0;background:rgba(5,15,14,.55);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
#sheet .in{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:0;flex:1 1 auto}
#sheet header{display:flex;justify-content:space-between;align-items:center}
#sheetClose{width:44px;height:44px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:12px;font-size:22px;line-height:1}
#sheetForm{display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:0;padding-bottom:4px;overscroll-behavior:contain}
@media (prefers-reduced-motion:no-preference){#sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

#toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:30;max-width:520px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:500}
#toast button{background:transparent;border:0;color:var(--bg);font:600 15px var(--display);letter-spacing:.06em;text-transform:uppercase;text-decoration:underline;min-height:36px}

nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav button{background:transparent;border:0;color:var(--muted);min-height:54px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 13px var(--display);letter-spacing:.07em;text-transform:uppercase}
nav button svg{width:22px;height:22px}
nav button[aria-current=page]{color:var(--accent);background:var(--soft)}

.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.filters .chip{flex:0 0 auto}
.range{display:flex;gap:6px}
.range .chip{flex:1;min-height:40px;padding:0 4px}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1;fill:none}
.chart .tx{fill:var(--muted);font:400 9.5px var(--mono)}
.chart .cb{fill:var(--accent)}
.chart .cb.p{fill:var(--c-p)}
.chart .cb.c{fill:var(--c-c)}
.chart .cb.g{fill:var(--c-g)}
.chart .cb.w{fill:var(--water)}
.chart .cb.m{fill:var(--warn)}
.chart .goal{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3;fill:none}
.chart .ln{stroke:var(--accent);stroke-width:2.2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.chart .goaltx{fill:var(--muted);font:500 9px var(--mono)}
.ch-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:8px}
.ch-head .v{font-size:30px}
.ch-head.big .v{font-size:44px}
select{min-height:44px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:0 10px;font:500 16px var(--body);max-width:100%}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.mealrow{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0}
.mealrow .bar{margin-top:0}
.chipx{display:inline-flex;gap:6px;align-items:center}
</style>

<div class="wrap">
  <header class="head">
    <div><div class="date" id="fecha"></div><h1>Bitácora</h1></div>
  </header>

  <main id="hoy" class="stack"></main>
  <main id="hist" class="stack" hidden></main>
  <main id="charts" class="stack" hidden></main>

</div>

<nav aria-label="Secciones"><div class="in" id="nav"></div></nav>

<div id="scrim" hidden></div>
<section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="in">
    <header><h2 id="sheetTitle"></h2><button id="sheetClose" type="button" aria-label="Cerrar">×</button></header>
    <div id="sheetForm"></div>
  </div>
</section>
<div id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
var KEY='bitacora-salud.v1';
var DEF={v:2,entries:[],seeded:false,lastExport:null,vasoMl:250,
  goals:{kcal:2800,p:160,c:400,g:70,ml:3000},lib:null,suples:null,molest:null,tags:null,grupos:null,eps:[]};
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
var mem=null;
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem}
var saved=load()||{};
var db=Object.assign({},DEF,saved);
db.goals=Object.assign({},DEF.goals,saved.goals||{});
if(saved.metaMl&&!saved.goals)db.goals.ml=+saved.metaMl;
if(!Array.isArray(db.entries))db.entries=[];
if(!Array.isArray(db.eps))db.eps=[];
db.v=2;
function persist(){mem=db;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}

/* ---------- utilidades ---------- */
var pad=function(n){return String(n).padStart(2,'0')};
var dk=function(d){d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var today=function(){return dk(Date.now())};
var DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
var MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function parseKey(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function lastDays(n){var out=[],t=new Date();t.setHours(12,0,0,0);for(var i=n-1;i>=0;i--){var d=new Date(t);d.setDate(t.getDate()-i);out.push(dk(d))}return out}
function dayName(k){var t=today();if(k===t)return 'Hoy';var y=new Date();y.setDate(y.getDate()-1);if(k===dk(y))return 'Ayer';var d=parseKey(k);return DIAS[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()]}
function hhmm(ts){var d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())}
function clockMin(ts){var d=new Date(ts);return d.getHours()*60+d.getMinutes()}
function clock12(m){m=((m%1440)+1440)%1440;var h=Math.floor(m/60),mm=m%60,ap=h<12?'am':'pm',h12=h%12===0?12:h%12;return h12+':'+pad(mm)+' '+ap}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmt(v){return Math.abs(v)>=1000?Math.round(v).toLocaleString('es-MX'):String(+(+v).toFixed(1))}
function fmtH(h){var m=Math.round(h*60);return Math.floor(m/60)+' h '+pad(m%60)+' min'}
function hourNow(){return new Date().getHours()}
function numv(x){if(x===''||x==null)return null;var n=+x;return isNaN(n)?null:n}
function getP(o,p){return p.split('.').reduce(function(a,k){return a==null?a:a[k]},o)}
function setP(o,p,v){var ks=p.split('.'),last=ks.pop(),t=ks.reduce(function(a,k){return a[k]},o);t[last]=v}
function safePhoto(p){return typeof p==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(p)}

/* ---------- iconos de interfaz ---------- */
var IC={
 drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
 food:'<path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-1.5 1-1.5 1-3M12 7c0-1.5 1-1.5 1-3M16 7c0-1.5 1-1.5 1-3"/>',
 gym:'<path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/>',
 moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
 flask:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/>',
 face:'<circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4 4 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/>',
 warn:'<path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18h.01"/>',
 pulse:'<path d="M3 12h4l2-6 4 12 2-6h6"/>',
 home:'<path d="M4 11l8-7 8 7v9H4z"/>',
 list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
 chart:'<path d="M4 20V8M10 20V4M16 20v-9M22 20H2"/>',
 box:'<path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/>',
 pencil:'<path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"/><path d="M14 7l3 3"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>'
};
function icon(n,cls){return '<svg class="ic '+(cls||'')+'" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>'}

/* ---------- catálogo ---------- */
var TYPES={
 agua:{n:'Agua',s:'Agua',i:'drop'},comida:{n:'Comida',s:'Comida',i:'food'},gym:{n:'Gym',s:'Gym',i:'gym'},sueno:{n:'Sueño',s:'Sueño',i:'moon'},
 suple:{n:'Suplementos',s:'Suples',i:'flask'},animo:{n:'Ánimo',s:'Ánimo',i:'face'},molestia:{n:'Molestias',s:'Molestia',i:'warn'},pulso:{n:'Pulso',s:'Pulso',i:'pulse'}
};
var ORDEN=['agua','comida','gym','sueno','suple','animo','molestia','pulso'];
var GRUPOS0={
 'Pecho':['Pecho'],
 'Espalda':['Dorsal','Espalda media','Trapecio','Espalda baja'],
 'Pierna':['Cuádriceps','Isquiotibiales','Glúteo','Pantorrilla'],
 'Brazo':['Bíceps largo','Bíceps corto','Tríceps largo','Tríceps medio','Tríceps lateral']
};
var MAIN={Pecho:'Pecho',Espalda:'Espalda',Pierna:'Pierna'};
var RUTINAS=['Pecho','Espalda','Pierna','Descanso'];
var MOMENTOS=['Desayuno','Comida','Cena','Snack'];
var ANIMO=[{e:'😣',l:'Muy mal'},{e:'🙁',l:'Mal'},{e:'😐',l:'Normal'},{e:'🙂',l:'Bien'},{e:'😄',l:'Muy bien'}];
var GYMOOD=[{e:'😩',l:'Mal'},{e:'😐',l:'Meh'},{e:'😄',l:'Bien'},{e:'💪',l:'Fuerte'}];
var INT=['','Soportable','Molesta','Incómoda','Fuerte','Intensa, súper fuerte'];
var GTAGS0=['Dormí poco','Sin energía','Dolor o molestia','Estrés','No comí bien','Sin ganas','Motivado','Buen pre-entreno','Entrené rápido'];
var TAGS0=['Concentrado','Triste','Aburrido','Estresado','Motivado','Cansado','Tranquilo','Gym bien, resto mal'];
var EMO_COMIDA=['🍳','🥚','🥣','🍞','🥞','🥑','🍌','🍎','🍇','🍓','🥛','🧀','🍗','🍖','🥩','🥓','🍚','🍝','🍕','🍔','🌮','🌯','🥗','🐟','🍤','🥔','🥦','🥕','🫘','🥜','🍫','☕','🥤','🍪','🍯','🧃','🍜','🥪','🥙','🍽️'];
var EMO_SUPLE=['💊','🧪','☕','🥤','⚡','🍵','🐟','🌿','🧂','💧','🥄','🍋','🫐','🍊','🥛','🔋'];
var EMO_MOL=['🤕','💢','🥱','🦴','😮‍💨','💨','🔥','🤢','🚽','🚫','🤧','🤒','😷','🤮','😵','🥶','🥵','😖','🦵','🦶','👁️','🦷','🫁','❤️‍🩹'];

/* ---------- datos iniciales ---------- */
function initLibs(){
 if(!db.lib)db.lib=[
  {id:'x_avena',nombre:'Avena con plátano',cant:'80 g de avena',momentos:['Desayuno'],kcal:420,p:15,c:70,g:8,emoji:'🥣',ex:true},
  {id:'x_huevo',nombre:'Huevos revueltos',cant:'4 huevos',momentos:['Desayuno'],kcal:320,p:25,c:2,g:24,emoji:'🍳',ex:true},
  {id:'x_pollo',nombre:'Pollo con arroz',cant:'200 g pollo · 150 g arroz',momentos:['Comida'],kcal:650,p:52,c:75,g:12,emoji:'🍗',ex:true},
  {id:'x_carne',nombre:'Carne asada con frijoles',cant:'180 g de carne',momentos:['Comida','Cena'],kcal:700,p:48,c:60,g:28,emoji:'🥩',ex:true},
  {id:'x_atun',nombre:'Atún con tortillas',cant:'1 lata · 3 tortillas',momentos:['Cena'],kcal:480,p:38,c:50,g:12,emoji:'🐟',ex:true},
  {id:'x_yogur',nombre:'Yogur con fruta',cant:'250 g',momentos:['Snack'],kcal:210,p:18,c:28,g:3,emoji:'🥛',ex:true},
  {id:'x_batido',nombre:'Batido de proteína',cant:'1 scoop · 300 ml',momentos:['Snack','Desayuno'],kcal:180,p:30,c:6,g:3,emoji:'🥤',ex:true}
 ];
 if(!db.suples)db.suples=[{id:'s_creatina',nombre:'Creatina',emoji:'🧪'},{id:'s_cafe',nombre:'Café',emoji:'☕'}];
 if(!db.molest)db.molest=[
  {id:'m1',tipo:'Físico',nombre:'Dolor de cabeza',emoji:'🤕'},{id:'m2',tipo:'Físico',nombre:'Dolor muscular',emoji:'💢'},
  {id:'m3',tipo:'Físico',nombre:'Cansancio extremo',emoji:'🥱'},{id:'m4',tipo:'Físico',nombre:'Articulación',emoji:'🦴'},
  {id:'m5',tipo:'Digestivo',nombre:'Pesadez',emoji:'😮‍💨'},{id:'m6',tipo:'Digestivo',nombre:'Gases',emoji:'💨'},
  {id:'m7',tipo:'Digestivo',nombre:'Acidez',emoji:'🔥'},{id:'m8',tipo:'Digestivo',nombre:'Náuseas',emoji:'🤢'},
  {id:'m9',tipo:'Digestivo',nombre:'Diarrea',emoji:'🚽'},
  {id:'m10',tipo:'Enfermedad',nombre:'Gripa',emoji:'🤧'},{id:'m11',tipo:'Enfermedad',nombre:'Fiebre',emoji:'🤒'},
  {id:'m12',tipo:'Enfermedad',nombre:'Dolor de garganta',emoji:'😷'},{id:'m13',tipo:'Enfermedad',nombre:'Infección estomacal',emoji:'🤮'}
 ];
 if(!db.tags)db.tags=TAGS0.slice();
 if(!db.gtags)db.gtags=GTAGS0.slice();
 if(!Array.isArray(db.prods))db.prods=[];
 if(!db.grupos){db.grupos={};Object.keys(GRUPOS0).forEach(function(g){db.grupos[g]=GRUPOS0[g].slice()})}
}
initLibs();

/* ---------- registros ---------- */
var noteDay='';
function whenTs(){if(!SH||!SH.day)return null;if(SH.day===today()&&!SH.editId)return null;var d=parseKey(SH.day),p=(SH.time||nowHM()).split(':');d.setHours(+p[0]||0,+p[1]||0,0,0);if(d.getTime()>Date.now())d=new Date();return d.toISOString()}
function nowHM(){var n=new Date();return pad(n.getHours())+':'+pad(n.getMinutes())}
function vday(){return (SH&&SH.day)||today()}
function dayEntries(k){return db.entries.filter(function(e){return dk(e.ts)===k})}
function add(e){e.id=uid();if(!e.ts){var w=whenTs();if(w){e.ts=w;noteDay=dayName(dk(w)).toLowerCase()}else e.ts=new Date().toISOString()}db.entries.push(e);persist();renderAll();if(SH&&SH.live)drawSheet();return e}
var editedNote=false;
function put(e){
 if(SH&&SH.editId){var ix=-1;db.entries.forEach(function(x,i){if(x.id===SH.editId)ix=i});
  if(ix>-1){var o=db.entries[ix];e.id=o.id;if(o.ex)e.ex=true;if(!e.ts)e.ts=whenTs()||o.ts;db.entries[ix]=e;persist();renderAll();editedNote=true;return e}}
 return add(e);
}
function removeEntry(id){db.entries=db.entries.filter(function(e){return e.id!==id});persist();renderAll()}
function sorted(){return db.entries.slice().sort(function(a,b){return a.ts<b.ts?1:-1})}
function todays(){var t=today();return db.entries.filter(function(e){return dk(e.ts)===t})}
function lastWeight(m){var s=sorted();for(var i=0;i<s.length;i++){var e=s[i];if(e.type==='gym'&&e.pesos&&e.pesos[m]!=null)return e.pesos[m]}return''}
function maxWeight(m,ex){var mx=0;db.entries.forEach(function(e){if(e.id!==ex&&e.type==='gym'&&e.pesos&&e.pesos[m]>mx)mx=e.pesos[m]});return mx}
function lastRutina(){var s=sorted();for(var i=0;i<s.length;i++)if(s[i].type==='gym')return s[i].rutina;return null}
function totalsFor(k){
 var t={kcal:0,p:0,c:0,g:0,ml:0,h:0,meals:{}};MOMENTOS.forEach(function(m){t.meals[m]={kcal:0,p:0}});
 db.entries.forEach(function(e){if(dk(e.ts)!==k)return;
  if(e.type==='comida'){t.kcal+=+e.kcal||0;t.p+=+e.p||0;t.c+=+e.c||0;t.g+=+e.g||0;var m=t.meals[e.momento];if(m){m.kcal+=+e.kcal||0;m.p+=+e.p||0}}
  else if(e.type==='agua')t.ml+=+e.ml||0;
  else if(e.type==='sueno')t.h+=+e.h||0});
 return t;
}
function ongoingEp(){for(var i=0;i<db.eps.length;i++)if(!db.eps[i].fin)return db.eps[i];return null}
function describe(e){
 switch(e.type){
  case 'agua':return {t:fmt(e.ml)+' ml'};
  case 'comida':{var m=[];if(e.kcal!=null)m.push(fmt(e.kcal)+' kcal');if(e.p!=null)m.push('P '+fmt(e.p));if(e.c!=null)m.push('C '+fmt(e.c));if(e.g!=null)m.push('G '+fmt(e.g));
    return {t:e.momento+': '+(e.nombre||'Sin nombre')+(e.porc&&e.porc!==1?' ×'+e.porc:''),s:[e.cant,m.join(' · ')].filter(Boolean).join(' · ')}}
  case 'gym':{var ps=Object.keys(e.pesos||{}).map(function(k){return k+' '+fmt(e.pesos[k])+' kg'+((e.prs||[]).indexOf(k)>-1?' ★PR':'')});
    var mood=e.animoGym?GYMOOD[e.animoGym-1]:null;
    var wh=(e.tags||[]).concat(e.nota?['“'+e.nota+'”']:[]).join(' · ');
    return {t:e.rutina+' · '+e.horario+(mood?' · '+mood.l:'')+(e.parcial?' · en curso':''),s:ps.join(' · '),n:wh?'Qué pasó: '+wh:''}}
  case 'sueno':return {t:fmtH(e.h),s:(e.ini&&e.fin?clock12(clockMin(e.ini))+' → '+clock12(clockMin(e.fin))+' · ':'')+(e.bloque||'')};
  case 'suple':return {t:e.item,s:e.momento};
  case 'animo':return {t:(ANIMO[e.nivel-1]||{l:'Ánimo'}).l,s:(e.tags||[]).concat(e.nota?[e.nota]:[]).join(' · ')};
  case 'molestia':return {t:e.tipo+': '+(e.nombre||e.zona||''),s:'Intensidad '+e.int+'/5 · '+(INT[e.int]||'')};
  case 'pulso':{var q=[];if(e.reposo!=null)q.push('Reposo '+fmt(e.reposo));if(e.prom!=null)q.push('Prom '+fmt(e.prom));if(e.max!=null)q.push('Máx '+fmt(e.max));return {t:q.join(' · ')+' bpm'}}
 }
 return {t:e.type};
}
function entryEmoji(e){
 if(e.type==='comida'||e.type==='suple'||e.type==='molestia')return e.emoji||'';
 if(e.type==='animo')return (ANIMO[e.nivel-1]||{}).e||'';
 if(e.type==='gym'&&e.animoGym)return GYMOOD[e.animoGym-1].e;
 return '';
}
function entryRow(e,withDel){
 var d=describe(e),T=TYPES[e.type]||{i:'list'},em=entryEmoji(e);
 return '<div class="ent">'+(em?'<span class="emo">'+esc(em)+'</span>':icon(T.i))+'<div><b>'+esc(d.t)+'</b>'+(d.s?'<div class="sub">'+esc(d.s)+'</div>':'')+(d.n?'<div class="sub">'+esc(d.n)+'</div>':'')+(e.ex?'<div class="sub mono">ejemplo</div>':'')+'</div>'+
  '<div class="col"><span class="t">'+hhmm(e.ts)+'</span>'+(withDel?'<div style="display:flex;gap:6px"><button class="del" type="button" data-edit="'+e.id+'">Editar</button><button class="del" type="button" data-del="'+e.id+'">Borrar</button></div>':'')+'</div></div>';
}

/* ---------- datos de ejemplo ---------- */
function seed(){
 var s=11,rnd=function(){s=(s*16807)%2147483647;return (s-1)/2147483646};
 var pick=function(a){return a[Math.floor(rnd()*a.length)]};
 var out=[],nowH=hourNow(),lib={};db.lib.forEach(function(i){lib[i.id]=i});
 function mk(off,h,m,o){
  if(off===0&&h>nowH)return;

var WSCRIPT="// Bitácora · widget grande (Scriptable)\n// Nombre del script: Bitacora (sin acento). La app lo abre con el resumen de hoy.\nconst FILE = \"bitacora-widget.json\";\nconst fm = FileManager.local();\nconst path = fm.joinPath(fm.documentsDirectory(), FILE);\n\n// 1) Si viene de la Bitácora, guarda el resumen recibido (por el enlace o, si no llegó, por el portapapeles)\nconst q = (args && args.queryParameters) || {};\nlet via = \"\";\nfunction valid(o) { return o && typeof o === \"object\" && o.f && o.G; }\nfunction save(o) { fm.writeString(path, JSON.stringify(o)); }\nif (!config.runsInWidget) {\n  try { if (q.d) { const o = JSON.parse(q.d); if (valid(o)) { save(o); via = \"enlace\"; } } } catch (e) {}\n  if (!via) {\n    try {\n      const s = Pasteboard.pasteString();\n      if (s && s.indexOf('\"G\"') > -1) { const o = JSON.parse(s); if (valid(o)) { save(o); via = \"portapapeles\"; } }\n    } catch (e) {}\n  }\n}\n\n// 2) Lee el último resumen guardado\nlet D = null;\ntry { if (fm.fileExists(path)) D = JSON.parse(fm.readString(path)); } catch (e) {}\n\nconst LIGHT = { bg: \"#EDF2F1\", fg: \"#10201F\", muted: \"#566B69\", soft: \"#DCEBE8\", track: \"#D2DEDC\", p: \"#0B7A75\", c: \"#B7791F\", g: \"#B4533C\", water: \"#2F78C4\", warn: \"#B4540A\" };\nconst DARKP = { bg: \"#0E1717\", fg: \"#E6F0EE\", muted: \"#8FA7A4\", soft: \"#1C3330\", track: \"#263A38\", p: \"#3FC1B8\", c: \"#E3B04B\", g: \"#E88A72\", water: \"#5BA7EE\", warn: \"#F0A060\" };\n// Para fondo y textos: iOS elige solo claro u oscuro, igual que la app\nconst dyn = (k) => Color.dynamic(new Color(LIGHT[k]), new Color(DARKP[k]));\nconst col = (h) => new Color(h);\n// Colores del dibujo de la botella: tonos que se ven bien sobre fondo claro y oscuro\nconst BT = { soft: new Color(\"#7F9593\", 0.28), line: \"#7F9593\", tick: new Color(\"#7F9593\", 0.6), water: \"#4A92E0\" };\nconst num = (n) => String(Math.round(n)).replace(/\\B(?=(\\d{3})+(?!\\d))/g, \",\");\nconst pad = (n) => (n < 10 ? \"0\" : \"\") + n;\nconst todayKey = () => { const d = new Date(); return d.getFullYear() + \"-\" + pad(d.getMonth() + 1) + \"-\" + pad(d.getDate()); };\nconst MES = [\"ene\", \"feb\", \"mar\", \"abr\", \"may\", \"jun\", \"jul\", \"ago\", \"sep\", \"oct\", \"nov\", \"dic\"];\n\n// ---------- dibujo ----------\nfunction barStack(parent, w, h, frac, key) {\n  const tr = parent.addStack(); tr.layoutHorizontally();\n  tr.size = new Size(w, h); tr.cornerRadius = h / 2; tr.backgroundColor = dyn(\"track\");\n  if (frac > 0) {\n    const f = tr.addStack(); f.size = new Size(Math.max(h, Math.min(1, frac) * w), h);\n    f.cornerRadius = h / 2; f.backgroundColor = dyn(key);\n    tr.addSpacer(); // empuja el progreso a la izquierda\n  }\n  return tr;\n}\n\nfunction bottlePoints() {\n  const pts = [];\n  const L = (x, y) => pts.push([x, y]);\n  const bez = (p0, c1, c2, p1) => {\n    for (let i = 1; i <= 12; i++) {\n      const t = i / 12, u = 1 - t;\n      pts.push([u*u*u*p0[0] + 3*u*u*t*c1[0] + 3*u*t*t*c2[0] + t*t*t*p1[0],\n                u*u*u*p0[1] + 3*u*u*t*c1[1] + 3*u*t*t*c2[1] + t*t*t*p1[1]]);\n    }\n  };\n  L(30, 6); L(50, 6); L(50, 24);\n  bez([50, 24], [50, 32], [72, 38], [72, 58]);\n  L(72, 182);\n  bez([72, 182], [72, 189.7], [65.7, 196], [58, 196]);\n  L(22, 196);\n  bez([22, 196], [14.3, 196], [8, 189.7], [8, 182]);\n  L(8, 58);\n  bez([8, 58], [8, 38], [30, 32], [30, 24]);\n  return pts;\n}\n\nfunction clipBelow(pts, level) { // se queda con la parte con y >= level\n  const out = [];\n  for (let i = 0; i < pts.length; i++) {\n    const a = pts[i], b = pts[(i + 1) % pts.length];\n    const ia = a[1] >= level, ib = b[1] >= level;\n    if (ia) out.push(a);\n    if (ia !== ib) {\n      const t = (level - a[1]) / (b[1] - a[1]);\n      out.push([a[0] + t * (b[0] - a[0]), level]);\n    }\n  }\n  return out;\n}\n\nfunction polyPath(pts) {\n  const p = new Path();\n  p.move(new Point(pts[0][0], pts[0][1]));\n  for (let i = 1; i < pts.length; i++) p.addLine(new Point(pts[i][0], pts[i][1]));\n  p.closeSubpath();\n  return p;\n}\n\nfunction bottleImage(ml, goal) {\n  const dc = new DrawContext();\n  dc.size = new Size(80, 202); dc.opaque = false; dc.respectScreenScale = true;\n  const pts = bottlePoints();\n  dc.addPath(polyPath(pts)); dc.setFillColor(BT.soft); dc.fillPath();\n  const pct = goal > 0 ? Math.min(1, ml / goal) : 0;\n  if (pct > 0) {\n    const level = 196 - pct * 170;\n    const wp = clipBelow(pts, level);\n    if (wp.length > 2) { dc.addPath(polyPath(wp)); dc.setFillColor(col(BT.water)); dc.fillPath(); }\n  }\n  const n = Math.round(goal / 500);\n  if (n >= 1 && n <= 12) {\n    for (let k = 1; k < n; k++) {\n      const y = 196 - (k * 500 / goal) * 170;\n      const tp = new Path(); tp.move(new Point(58, y)); tp.addLine(new Point(72, y));\n      dc.addPath(tp); dc.setStrokeColor(BT.tick); dc.setLineWidth(1.5); dc.strokePath();\n    }\n  }\n  dc.addPath(polyPath(pts)); dc.setStrokeColor(col(BT.line)); dc.setLineWidth(3); dc.strokePath();\n  return dc.getImage();\n}\n\n// ---------- widget ----------\nconst w = new ListWidget();\nw.backgroundColor = dyn(\"bg\");\nw.setPadding(16, 16, 14, 16);\nw.refreshAfterDate = new Date(Date.now() + 15 * 60 * 1000);\n\nif (!D) {\n  const t = w.addText(\"Bitácora\");\n  t.font = Font.boldSystemFont(20); t.textColor = dyn(\"fg\");\n  w.addSpacer(6);\n  const s = w.addText(\"Abre la Bitácora y toca “↻ Widget” para cargar tu resumen de hoy.\");\n  s.font = Font.systemFont(13); s.textColor = dyn(\"muted\");\n} else {\n  const G = D.G || {};\n  const fresh = D.f === todayKey();\n  let label = \"Hoy\";\n  if (!fresh) {\n    const p = String(D.f || \"\").split(\"-\");\n    label = p.length === 3 ? \"Datos del \" + (+p[2]) + \" \" + MES[(+p[1]) - 1] : \"Sin actualizar\";\n  }\n\n  // encabezado\n  const head = w.addStack(); head.centerAlignContent();\n  const h1 = head.addText(label); h1.font = Font.boldSystemFont(20); h1.textColor = dyn(fresh ? \"fg\" : \"warn\");\n  head.addSpacer();\n  const h2 = he function gradArc(a,b,r){

  var a0=a+i*step,a1=a+(i+1)*step+(i<n-1?.8:0),p1=pt(a0,r),p2=pt(a1,r),c=mixRGB(c1,c2,i/(n-1));

/* productos: tablas nutrimentales */
function findProd(id){return findLib(db.prods,id)}
function r1(v){return Math.round(v*10)/10}
function prodCalc(pr,cant){var q=numv(cant),o={kcal:0,p:0,c:0,g:0};if(!pr||!(q>0)||!(pr.base>0))return o;var f=q/pr.base;['kcal','p','c','g'].forEach(function(k){if(pr[k]!=null)o[k]=pr[k]*f});return o}
function useIngs(d){return !!(d&&d.ings&&d.ings.length&&d.ings.every(function(i){return findProd(i.pid)}))}
function ingTotals(ings){var t={kcal:0,p:0,c:0,g:0};(ings||[]).forEach(function(i){var r=prodCalc(findProd(i.pid),i.cant);['kcal','p','c','g'].forEach(function(k){t[k]+=r[k]})});return t}
function syncIngs(d){if(!useIngs(d))return;var t=ingTotals(d.ings);d.kcal=Math.round(t.kcal);d.p=r1(t.p);d.c=r1(t.c);d.g=r1(t.g)}
function macroLine(r){return fmt(Math.round(r.kcal))+' kcal · P '+fmt(r1(r.p))+' · C '+fmt(r1(r.c))+' · G '+fmt(r1(r.g))}
function ingLine(pr,cant){if(!pr)return 'ya no está en tu catálogo';if(!(numv(cant)>0))return 'escribe '+cuantos(pr.unidad)+' usas';return macroLine(prodCalc(pr,cant))}
function baseLabel(pr){return pr.unidad==='unid'?(+pr.base===1?'1 unidad':fmt(pr.base)+' unidades'):fmt(pr.base)+' '+pr.unidad}
function prodSub(pr){var nb=function(t){return t.replace(/ /g,'\u00a0')};return [baseLabel(pr),fmt(pr.kcal||0)+' kcal','P '+fmt(pr.p||0),'C '+fmt(pr.c||0),'G '+fmt(pr.g||0)].map(nb).join(' · ')}
function npDraft(pr){pr=pr||{};var nv=function(v){return v==null?'':v};return {id:pr.id||null,nombre:pr.nombre||'',base:pr.base||100,unidad:pr.unidad||'g',kcal:nv(pr.kcal),p:nv(pr.p),c:nv(pr.c),g:nv(pr.g),confirm:false}}
function uName(u){return u==='g'?'gramos':u==='ml'?'ml':'unidades'}
function cuantos(u){return u==='unid'?'cuántas unidades':'cuántos '+uName(u)}
function prodForm(path,np){
 return '<div class="pbox"><h3>'+(np.id?'Editar producto':'Nuevo producto')+'</h3>'+fld(path+'.nombre','Nombre',{t:'text',ph:'Granola'})+
  '<div class="grid2">'+fld(path+'.base','La tabla viene por',{unit:np.unidad,ph:'100'})+'<div class="fld"><span>Unidad</span>'+segB(path+'.unidad',[['g','g'],['ml','ml'],['unid','unidades']],np.unidad)+'</div></div>'+
  '<div class="grid2">'+fld(path+'.kcal','Calorías',{unit:'kcal',ph:'auto'})+fld(path+'.p','Proteína',{unit:'g'})+fld(path+'.c','Carbohidratos',{unit:'g'})+fld(path+'.g','Grasa',{unit:'g'})+'</div>'+
  '<p class="sub">Copia los números tal como vienen en la etiqueta para esa porción. Si dejas las calorías vacías, se calculan con los macros.</p>'+
  '</div>';
}
function prodFromDraft(np){
 var nm=(np.nombre||'').trim(),b=numv(np.base),p=numv(np.p),c=numv(np.c),g=numv(np.g),k=numv(np.kcal);
 if(!nm)return {err:'Escribe el nombre del producto.'};
 if(!(b>0))return {err:'Escribe la porción de la tabla, por ejemplo 100.'};
 if(k==null&&(p!=null||c!=null||g!=null))k=Math.round(4*(p||0)+4*(c||0)+9*(g||0));
 if(k==null)return {err:'Escribe las calorías o al menos un macro del producto.'};
 return {item:{nombre:nm,base:b,unidad:['g','ml','unid'].indexOf(np.unidad)>-1?np.unidad:'g',kcal:k,p:p,c:c,g:g}};
}
function upsertProd(np){
 var r=prodFromDraft(np);if(r.err)return r;
 var cur=np.id&&findProd(np.id);
 if(cur)Object.assign(cur,r.item);else{cur=Object.assign({id:uid()},r.item);db.prods.push(cur)}
 db.lib.forEach(function(i){if(i.ings&&i.ings.some(function(x){return x.pid===cur.id})&&useIngs(i)){var t=ingTotals(i.ings);i.kcal=Math.round(t.kcal);i.p=r1(t.p);i.c=r1(t.c);i.g=r1(t.g)}});
 persist();return {prod:cur};
}

function protPer100(pr){return pr.kcal>0&&pr.p!=null?pr.p/pr.kcal*100:null}
function catalog(st,mode){
 var sort=st.psort||'az',list=db.prods.slice(),used={};
 if(mode==='pick')(st.ed.ings||[]).forEach(function(i){used[i.pid]=1});
 if(sort==='p')list.sort(function(a,b){return (protPer100(b)||0)-(protPer100(a)||0)});else list.sort(function(a,b){return a.nombre.localeCompare(b.nombre,'es')});
 var rows=list.map(function(pr){var pp=protPer100(pr);
  return '<button type="button" class="prow pbtn" '+(mode==='pick'?'data-ingadd':'data-pedit')+'="'+esc(pr.id)+'" data-pname="'+esc(pr.nombre.toLowerCase())+'"><div style="min-width:0"><b>'+esc(pr.nombre)+'</b>'+(used[pr.id]?' <span class="cnt">ya agregado</span>':'')+'<div class="sub mono">'+esc(prodSub(pr))+'</div>'+(pp!=null?'<div class="sub mono tb" style="opacity:.75;font-size:11px">'+esc(fmt(r1(pp)))+' g de proteína por cada 100 kcal</div>':'')+'</div>'+icon(mode==='pick'?'plus':'pencil')+'</button>'}).join('');
 return '<h3>'+(mode==='pick'?'Elige un producto':'Mis productos')+'</h3>'+
  (list.length>6?'<span class="inp"><input id="pq" type="text" placeholder="Buscar producto" autocomplete="off" aria-label="Buscar producto"></span>':'')+
  (list.length>1?'<div class="chips"><button type="button" class="chip'+(sort==='az'?' on':'')+'" data-pick="psort" data-val="az">A–Z</button><button type="button" class="chip'+(sort==='p'?' on':'')+'" data-pick="psort" data-val="p">Más proteína por kcal</button></div>':'')+
  (list.length?'<div class="list">'+rows+'</div>':'<p class="empty">Aún no tienes productos. Crea el primero con su tabla nutrimental.</p>')+
  '<div class="actions"><button type="button" class="ghost" data-act="'+(mode==='pick'?'pickoff':'plistoff')+'">Volver</button><button type="button" class="primary" '+(mode==='pick'?'data-act="npnew"':'data-cardnew="prod"')+'>+ Nuevo producto</button></div>';
}
function prodList(st){return catalog(st,'list')}
function macroStats(o,pc){
 var mv=function(k){var v=numv(o[k]);return v==null?null:(k==='kcal'?Math.round(v*pc):r1(v*pc))};
 var stat=function(cls,lab,v,u){return '<div class="'+cls+'"><span class="k">'+lab+'</span><span class="v">'+(v==null?'—':fmt(v))+(v!=null&&u?'<small>'+u+'</small>':'')+'</span></div>'};
 return stat('kc','kcal',mv('kcal'))+stat('p','Proteína',mv('p'),'g')+stat('c','Carbos',mv('c'),'g')+stat('g','Grasa',mv('g'),'g');
}
function ingsText(ings,pc){return (ings||[]).map(function(i){var pr=findProd(i.pid);return pr?pr.nombre+' '+fmt(r1((numv(i.cant)||0)*pc))+' '+pr.unidad:''}).filter(Boolean).join(' · ')}
function comidaPreview(st){

/* recientes */
function recentComidas(momento){
 function collect(filter){var seen={},out=[];sorted().forEach(function(e){
  if(e.type!=='comida'||!e.nombre||seen[e.nombre]||out.length>=4)return;if(filter&&e.momento!==momento)return;seen[e.nombre]=1;
  var lib=e.lib&&findLib(db.lib,e.lib),p=e.porc||1;
  if(lib){out.push(Object.assign({},lib));return}
  out.push({id:lib?lib.id:null,nombre:e.nombre,cant:e.cant||'',emoji:e.emoji||(lib&&lib.emoji)||'🍽️',photo:lib?lib.photo:'',momentos:lib?lib.momentos:[e.momento],
   kcal:e.kcal!=null?e.kcal/p:null,p:e.p!=null?e.p/p:null,c:e.c!=null?e.c/p:null,g:e.g!=null?e.g/p:null})});return out}
 var r=collect(true);return r.length?r:collect(false);
}
function recentMolest(){
 var seen={},out=[];sorted().forEach(function(e){
  if(e.type!=='molestia'||out.length>=4)return;var nm=e.nombre||e.zona;if(!nm)return;var key=e.tipo+'|'+nm;if(seen[key])return;seen[key]=1;
  var lib=db.molest.filter(function(i){return i.nombre===nm&&i.tipo===e.tipo})[0];
  out.push({id:lib?lib.id:null,nombre:nm,tipo:e.tipo,emoji:e.emoji||(lib&&lib.emoji)||'⚠️'})});
 return out;
}
function findLib(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null}

 else if(kind==='comida'){kind='e_comida';st={nombre:e.nombre||'',cant:e.cant||'',momento:e.momento||'Comida',kcal:nv(e.kcal),p:nv(e.p),c:nv(e.c),g:nv(e.g),err:''}}

/* registro de tarjetas */
function logComida(it,momento,porc){
 var e={type:'comida',momento:momento,nombre:it.nombre,cant:it.cant||'',porc:porc,emoji:it.emoji||'',lib:it.id||null};
 ['kcal','p','c','g'].forEach(function(k){if(it[k]!=null)e[k]=k==='kcal'?Math.round(it[k]*porc):Math.round(it[k]*porc*10)/10});
 return add(e);
}
function logMolestia(it,st){
 var e={type:'molestia',tipo:it.tipo,nombre:it.nombre,zona:it.nombre,emoji:it.emoji,int:st.int};
 if(it.tipo==='Enfermedad'){var ep=ongoingEp();if(!ep){ep={id:uid(),nombre:it.nombre,ini:whenTs()||new Date().toISOString(),fin:null};db.eps.push(ep)}e.ep=ep.id}
 return add(e);
}

  kcal:it.kcal==null?'':Math.round(it.kcal),p:it.p==null?'':it.p,c:it.c==null?'':it.c,g:it.g==null?'':it.g,emoji:it.emoji||'🍽️',photo:it.photo||'',confirm:false};

/* guardado */
function doSave(name){
 var st=SH.st,parts=name.split(':'),kind=parts[0],act=parts[1];
 st.err='';
 if(kind==='agua'){var ml=numv(st.ml);if(!(ml>0)){st.err='Escribe cuántos ml tomaste.';return drawSheet()}put({type:'agua',ml:ml});closeSheet();toast(fmt(ml)+' ml guardados');return}
 if(kind==='pulso'){var r=numv(st.reposo),p=numv(st.prom),m=numv(st.max);if(r==null&&p==null&&m==null){st.err='Escribe al menos un valor.';return drawSheet()}
  var o={type:'pulso'};if(r!=null)o.reposo=r;if(p!=null)o.prom=p;if(m!=null)o.max=m;put(o);closeSheet();toast('Pulso guardado');return}
 if(kind==='animo'){if(!st.nivel){st.err='Elige cómo te sientes.';return drawSheet()}put({type:'animo',nivel:st.nivel,tags:st.tags.slice(),nota:(st.nota||'').trim()});closeSheet();toast('Ánimo guardado');return}
 if(kind==='gym'){
  var ps={},prs=[],tid=SH.editId||st.sid;
  if(st.rutina!=='Descanso'){Object.keys(st.sel).forEach(function(mu){if(!st.sel[mu])return;var w=numv(st.w[mu]);if(w!=null&&w>0){ps[mu]=w;var pm=maxWeight(mu,tid);if(pm>0&&w>pm)prs.push(mu)}});
   if(!Object.keys(ps).length){st.err='Activa un músculo y escribe su peso, o elige Descanso.';return drawSheet()}}
  var ge={type:'gym',rutina:st.rutina,horario:st.horario,pesos:ps};if(st.animoGym)ge.animoGym=st.animoGym;if(prs.length)ge.prs=prs;
  if(st.tags&&st.tags.length)ge.tags=st.tags.slice();if((st.nota||'').trim())ge.nota=st.nota.trim();
  var ses=!SH.editId&&gymSession(st);
  if(ses){ge.id=ses.id;ge.ts=ses.ts;db.entries=db.entries.map(function(x){return x.id===ses.id?ge:x});persist();renderAll()}else put(ge);
  closeSheet();toast(prs.length?'¡PR en '+prs.join(', ')+'! '+prs.map(function(x){return fmt(ps[x])+' kg'}).join(', '):'Gym guardado');return}
 if(kind==='sueno'){
  var dur=((st.fin-st.ini)%1440+1440)%1440;if(!dur){st.err='El inicio y el final son iguales.';return drawSheet()}
  var fd=parseKey(SH.day||today());fd.setHours(Math.floor(st.fin/60),st.fin%60,0,0);
  if(fd.getTime()>Date.now()+60000){st.err='Esa hora de despertar todavía no llega. Elige otro día o cambia la hora.';return drawSheet()}
  var idt=new Date(fd.getTime()-dur*60000),night=dur>=180&&(st.ini>=18*60||st.ini<4*60);
  put({type:'sueno',h:+(dur/60).toFixed(2),ini:idt.toISOString(),fin:fd.toISOString(),ts:fd.toISOString(),bloque:night?'Noche':'Siesta'});closeSheet();toast('Sueño guardado: '+fmtH(dur/60));return}
 if(kind==='e_comida'||kind==='e_suple'||kind==='e_molestia'){
  var o0=null;db.entries.forEach(function(x){if(x.id===SH.editId)o0=x});if(!o0){closeSheet();return}
  var ne=Object.assign({},o0);delete ne.ts;
  if(kind==='e_comida'){
   var nm0=(st.nombre||'').trim();if(!nm0){st.err='Escribe el nombre.';return drawSheet()}
   var p0=numv(st.p),c0=numv(st.c),g0=numv(st.g),k0=numv(st.kcal);if(k0==null&&(p0!=null||c0!=null||g0!=null))k0=Math.round(4*(p0||0)+4*(c0||0)+9*(g0||0));
   if(k0==null){st.err='Escribe las calorías o al menos un macro.';return drawSheet()}
   ne.nombre=nm0;ne.cant=(st.cant||'').trim();ne.momento=st.momento;ne.kcal=k0;ne.p=p0;ne.c=c0;ne.g=g0}
  else if(kind==='e_suple')ne.momento=st.momento;
  else ne.int=st.int;
  put(ne);closeSheet();toast('Registro actualizado');return}
 if(kind==='comida'){
  if(act==='pncancel'){st.np=null;drawSheet();$('#sheetForm').scrollTop=0;return}
  if(act==='pndel'){if(!st.np.confirm){st.np.confirm=true;return drawSheet()}var did=st.np.id;db.prods=db.prods.filter(function(x){return x.id!==did});persist();st.np=null;toast('Producto eliminado');drawSheet();$('#sheetForm').scrollTop=0;return}
  if(act==='pnsave'){var rp=upsertProd(st.np);if(rp.err){st.err=rp.err;return drawSheet()}st.np=null;toast('Producto guardado: '+rp.prod.nombre);drawSheet();$('#sheetForm').scrollTop=0;return}
  if(act==='back'){st.ed=null;return drawSheet()}
  if(act==='del'){var d0=st.ed;if(!d0.confirm){d0.confirm=true;return drawSheet()}db.lib=db.lib.filter(function(i){return i.id!==d0.id});persist();st.ed=null;toast('Tarjeta eliminada');return drawSheet()}
  if(act==='npcancel'){st.ed.np=null;drawSheet();$('#sheetForm').scrollTop=0;return}
  if(act==='npsave'){var rr=upsertProd(st.ed.np);if(rr.err){st.err=rr.err;return drawSheet()}
   var nuevo=!st.ed.np.id;if(nuevo)st.ed.ings.push({pid:rr.prod.id,cant:''});
   st.ed.np=null;st.ed.pick=false;syncIngs(st.ed);toast('Producto guardado: '+rr.prod.nombre);drawSheet();
   if(nuevo)focusIng(st.ed.ings.length-1);return}
  if(st.ed.np){st.err='Primero guarda o cancela el producto nuevo.';return drawSheet()}
  var falta=(st.ed.ings||[]).filter(function(i){return findProd(i.pid)&&!(numv(i.cant)>0)})[0];
  if(falta){var fp=findProd(falta.pid);st.err='Escribe '+cuantos(fp.unidad)+' de '+fp.nombre+' usas.';return drawSheet()}
  var dd=st.ed,hasI=dd.ings&&dd.ings.length;
  if(hasI&&!useIngs(dd)){st.err='Quita el producto que ya no está en tu catálogo.';return drawSheet()}
  if(!hasI&&!(dd.id&&numv(dd.kcal)!=null)){st.err='Agrega al menos un producto para calcular los macros.';return drawSheet()}
  var it=edComidaItem();
  if(!it.nombre){st.err='Escribe el nombre de la comida.';return drawSheet()}
  if(it.kcal==null){st.err='Agrega al menos un producto para calcular los macros.';return drawSheet()}
  if(!it.momentos.length){st.err='Elige en qué comidas aparece.';return drawSheet()}
  if(act==='once'){logComida({nombre:it.nombre,cant:it.cant,emoji:it.emoji,kcal:it.kcal,p:it.p,c:it.c,g:it.g,id:null},st.momento,st.porc);st.ed=null;toast('Registrado solo esta vez');return drawSheet()}
  var saved=it.id&&findLib(db.lib,it.id);
  if(saved){Object.assign(saved,{nombre:it.nombre,cant:it.cant,momentos:it.momentos,kcal:it.kcal,p:it.p,c:it.c,g:it.g,emoji:it.emoji,photo:it.photo});delete saved.ex}
  else{saved={id:uid(),nombre:it.nombre,cant:it.cant,momentos:it.momentos,kcal:it.kcal,p:it.p,c:it.c,g:it.g,emoji:it.emoji,photo:it.photo};db.lib.push(saved)}
  if(it.ings.length)saved.ings=it.ings;else delete saved.ings;

 if(kind==='suple'||kind==='molestia'){

  var nm=(dd.nombre||'').trim();if(!nm){st.err='Escribe un nombre.';return drawSheet()}
  var cur=dd.id&&findLib(lib,dd.id);
  if(cur){cur.nombre=nm;cur.emoji=dd.emoji;if(kind==='molestia')cur.tipo=dd.tipo}
  else{var ni={id:uid(),nombre:nm,emoji:dd.emoji};if(kind==='molestia')ni.tipo=dd.tipo;lib.push(ni)}
  persist();st.ed=null;toast('Guardado');return drawSheet()}
 if(kind==='prod'){
  if(act==='del'){if(!st.np.confirm){st.np.confirm=true;return drawSheet()}db.prods=db.prods.filter(function(x){return x.id!==st.np.id});persist();closeSheet();if(tab==='datos')renderDatos();toast('Producto eliminado');return}
  var r2=upsertProd(st.np);if(r2.err){st.err=r2.err;return drawSheet()}
  closeSheet();if(tab==='datos')renderDatos();toast('Producto guardado: '+r2.prod.nombre);return}
}

/* ---------- eventos ---------- */
var SEL='[data-open],[data-quick],[data-tab],[data-filter],[data-hq],[data-dayview],[data-range],[data-del],[data-edit],[data-close],[data-act],[data-pick],[data-tog],[data-card],[data-cardedit],[data-cardnew],[data-save],[data-tm],[data-addg],[data-tagedit],[data-undo],[data-delm],[data-addm],[data-sm],[data-ingadd],[data-ingdel],[data-prodedit],[data-prodnew],[data-pedit]';
document.addEventListener('click',function(e){
 var t=e.target.closest(SEL);
 if(!t){if(e.target.id==='scrim')closeSheet();return}
 var d=t.dataset,st=SH&&SH.st;
 if(d.open){openSheet(d.open)}
 else if(d.quick){var ml=d.quick==='vaso'?db.vasoMl:+d.quick,en=add({type:'agua',ml:ml});toast('Agregaste '+fmt(ml)+' ml de agua',en.id)}
 else if(d.undo){removeEntry(d.undo);$('#toast').hidden=true}
 else if(d.tab)showTab(d.tab);
 else if(d.filter){histFilter=d.filter;renderHist()}
 else if(d.hq){if(d.hq==='hoy'){hFrom=hTo=today()}else if(d.hq==='ayer'){hFrom=hTo=dayKeyOff(1)}else{hFrom=hTo=''}renderHist()}
 else if(d.dayview){rFrom=rTo=d.dayview;range='c';showTab('charts')}
 else if(d.range!=null){range=d.range==='c'?'c':+d.range;renderCharts()}
 else if('close' in d)closeSheet();
 else if(d.pick&&st){
  var v=d.n?+d.val:d.val;setP(st,d.pick,v);st.err='';
  if(SH.kind==='gym'&&d.pick==='rutina'){gymFor(st,v);gymMerge(st)}
  if(/(^|\.)np\.unidad$/.test(d.pick)){var npo=getP(st,d.pick.replace(/\.unidad$/,''));if(v==='unid'&&+npo.base===100)npo.base=1;else if(v!=='unid'&&+npo.base===1)npo.base=100}
  if(SH.kind==='molestia'&&d.pick==='tipo')st.ed=null;
  drawSheet()}
 else if(d.tog&&st){var arr=getP(st,d.tog),ix=arr.indexOf(d.val);if(ix>-1)arr.splice(ix,1);else arr.push(d.val);drawSheet()}
 else if(d.sm&&st)saveMuscle(d.sm);
 else if(d.pedit&&st){var pe0=findProd(d.pedit);if(pe0){st.np=npDraft(pe0);st.err='';drawSheet();$('#sheetForm').scrollTop=0}}
 else if(d.ingadd&&st&&st.ed){st.ed.ings.push({pid:d.ingadd,cant:''});st.ed.pick=false;st.err='';drawSheet();focusIng(st.ed.ings.length-1)}
 else if(d.ingdel!=null&&st&&st.ed){st.ed.ings.splice(+d.ingdel,1);syncIngs(st.ed);drawSheet()}
 else if(d.prodedit){var pe=findProd(d.prodedit);if(pe)openSheet('prod',{np:npDraft(pe),err:''})}
 else if('prodnew' in d)openSheet('prod',{np:npDraft(),err:''});
 else if(d.tm&&st){var m=d.tm;if(st.sel[m]&&isSaved(st,m))unsaveMuscle(st,m);st.sel[m]=!st.sel[m];if(st.sel[m]&&(st.w[m]===''||st.w[m]==null))st.w[m]=lastWeight(m);drawSheet()}
 else if(d.addg&&st){st.addG=d.addg;st.newM='';drawSheet()}
 else if(d.card&&st){
  var kind=d.card;
  if(kind==='comida'){var it=d.rid!=null?SH.recents[+d.rid]:findLib(db.lib,d.id);if(it){st.prev=it;st.porc=1;st.err='';drawSheet();$('#sheetForm').scrollTop=0}}
  else if(kind==='suple'){var s=findLib(db.suples,d.id);if(s){add({type:'suple',item:s.nombre,emoji:s.emoji,momento:st.momento});toast(s.nombre+' · '+st.momento.toLowerCase())}}
  else if(kind==='molestia'){var mo=d.rid!=null?SH.recents[+d.rid]:findLib(db.molest,d.id);if(mo){logMolestia(mo,st);toast(mo.nombre+' · intensidad '+st.int)}}}
 else if(d.cardedit&&st){
  var k2=d.cardedit;
  if(k2==='comida'){var c0=d.rid!=null?SH.recents[+d.rid]:findLib(db.lib,d.id);if(c0){st.ed=edFromComida(c0);st.err='';drawSheet();$('#sheetForm').scrollTop=0}}
  else if(k2==='suple'){var s0=findLib(db.suples,d.id);if(s0){st.ed={id:s0.id,nombre:s0.nombre,emoji:s0.emoji,confirm:false};drawSheet();$('#sheetForm').scrollTop=0}}
  else if(k2==='molestia'){var m0=d.rid!=null?SH.recents[+d.rid]:findLib(db.molest,d.id);if(m0){st.ed={id:m0.id||null,nombre:m0.nombre,tipo:m0.tipo,emoji:m0.emoji,confirm:false};drawSheet();$('#sheetForm').scrollTop=0}}}
 else if(d.cardnew&&st){
  if(d.cardnew==='prod')st.np=npDraft();
  else if(d.cardnew==='comida')st.ed=edFromComida({nombre:'',momentos:[st.momento]});
  else if(d.cardnew==='suple')st.ed={id:null,nombre:'',emoji:'💊',confirm:false};
  else st.ed={id:null,nombre:'',tipo:st.tipo,emoji:'⚠️',confirm:false};
  st.err='';drawSheet();$('#sheetForm').scrollTop=0}
 else if(d.save&&st)doSave(d.save);
 else if(d.tagedit&&st){st.editing=d.tagedit;st.editVal=d.tagedit;drawSheet()}
 else if(d.edit)openEdit(d.edit);
 else if(d.del){if(t.classList.contains('arm')){removeEntry(d.del)}else{t.classList.add('arm');t.textContent='¿Seguro?';setTimeout(function(){if(t.isConnected){t.classList.remove('arm');t.textContent='Borrar'}},3000)}}
 else if(d.delm){var pr=d.delm.split('|');db.grupos[pr[0]]=db.grupos[pr[0]].filter(function(x){return x!==pr[1]});persist();renderDatos()}
 else if(d.addm){var inp=document.getElementById('gm_'+d.addm),nm=inp&&inp.value.trim();if(nm&&db.grupos[d.addm].indexOf(nm)<0){db.grupos[d.addm].push(nm);persist();renderDatos()}}
 else if(d.act)act(d.act);
});
function act(a){
 var st=SH&&SH.st;
 if(a==='clearex'){db.entries=db.entries.filter(function(x){return !x.ex});db.lib=db.lib.filter(function(x){return !x.ex});db.seeded=true;persist();renderAll();if(tab==='datos')renderDatos();toast('Se borraron los datos de ejemplo.')}
 else if(a==='copy'){copyText(exportJSON()).then(function(ok){if(ok){markExport();toast('JSON copiado. Pégalo en Notas.')}else toast('Selecciona el texto de abajo y cópialo a mano.')})}
 else if(a==='dayhoy'&&SH)setDay(today());
 else if(a==='dayayer'&&SH)setDay(dayKeyOff(1));
 else if(a==='share')doShare();
 else if(a==='widget'){toast('Abriendo Scriptable…');var wj=JSON.stringify(widgetData()),go=function(){window.location.href=widgetURL()};try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(wj).then(function(){setTimeout(go,100)},function(){setTimeout(go,150)})}else setTimeout(go,150)}catch(_){setTimeout(go,150)}}
 else if(a==='copyscript'){var ws=$('#wsTxt');var done=function(ok){toast(ok?'Script copiado. Pégalo en Scriptable.':'Selecciona el texto y cópialo a mano.')};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(WSCRIPT).then(function(){done(true)},function(){ws&&ws.select();done(false)})}else{ws&&ws.select();done(false)}}
 else if(a==='import')doImport();
 else if(a==='recover'){var ep=ongoingEp();if(ep){ep.fin=new Date().toISOString();persist();renderAll();if(SH&&SH.kind==='molestia')drawSheet();toast('Me alegra. Marqué tu recuperación.')}}
 else if(a==='pliston'&&st){st.plist=true;st.err='';drawSheet();$('#sheetForm').scrollTop=0}
 else if(a==='plistoff'&&st){st.plist=false;drawSheet();$('#sheetForm').scrollTop=0}
 else if(a==='prevlog'&&st&&st.prev){var pv=st.prev;logComida(pv,st.momento,st.porc);toast(st.momento+': '+pv.nombre+(st.porc!==1?' ×'+st.porc:''));st.prev=null;st.porc=1;drawSheet();$('#sheetForm').scrollTop=0}
 else if(a==='prevedit'&&st&&st.prev){st.ed=edFromComida(st.prev);st.prev=null;st.err='';drawSheet();$('#sheetForm').scrollTop=0}
 else if(a==='prevback'&&st){st.prev=null;st.porc=1;drawSheet();$('#sheetForm').scrollTop=0}
 else if(a==='pickon'&&st&&st.ed){st.ed.pick=true;st.ed.np=null;st.err='';drawSheet();$('#sheetForm').scrollTop=0}
 else if(a==='pickoff'&&st&&st.ed){st.ed.pick=false;drawSheet();var lastI=$('[data-act="pickon"]');if(lastI)try{lastI.scrollIntoView({block:'center'})}catch(_){}}
 else if(a==='npnew'&&st&&st.ed){st.ed.np=npDraft();st.err='';drawSheet();$('#sheetForm').scrollTop=0}
 else if(a==='nophoto'&&st&&st.ed){st.ed.photo='';drawSheet()}
 else if(a==='addm'&&st){var n=(st.newM||'').trim();if(n&&db.grupos[st.addG].indexOf(n)<0){db.grupos[st.addG].push(n);st.sel[n]=true;st.w[n]='';persist()}st.addG=null;st.newM='';drawSheet()}
 else if(a==='cancelm'&&st){st.addG=null;st.newM='';drawSheet()}
 else if(a==='tagmode'&&st){st.tagEdit=!st.tagEdit;st.editing=null;st.adding=false;drawSheet()}
 else if(a==='tagnew'&&st){st.adding=true;st.newTag='';drawSheet()}
 else if(a==='tagcancel'&&st){st.adding=false;st.editing=null;drawSheet()}
 else if(a==='tagadd'&&st){var K1=st.tagKey||'tags',tg=(st.newTag||'').trim();
  if(tg&&!db[K1].some(function(x){return x.toLowerCase()===tg.toLowerCase()})){db[K1].push(tg);st.tags.push(tg);persist()}
  st.adding=false;st.newTag='';drawSheet()}
 else if(a==='tagsave'&&st){var K2=st.tagKey||'tags',TT=K2==='gtags'?'gym':'animo',old=st.editing,nv=(st.editVal||'').trim(),ix=db[K2].indexOf(old);
  if(nv&&ix>-1&&(nv===old||!db[K2].some(function(x){return x.toLowerCase()===nv.toLowerCase()}))){
   db[K2][ix]=nv;db.entries.forEach(function(en){if(en.type===TT&&en.tags)en.tags=en.tags.map(function(x){return x===old?nv:x})});
   st.tags=st.tags.map(function(x){return x===old?nv:x});persist();renderAll()}
  st.editing=null;drawSheet()}
 else if(a==='tagdel'&&st){var K3=st.tagKey||'tags',o2=st.editing;db[K3]=db[K3].filter(function(x){return x!==o2});st.tags=st.tags.filter(function(x){return x!==o2});persist();st.editing=null;drawSheet()}
}
document.addEventListener('input',function(e){
 var t=e.target;if(!SH)return;var st=SH.st;
 if(t.id==='shTime'){if(t.value){SH.time=t.value;var nt=$('#dayNoteT');if(nt)nt.textContent=t.value}return}
 if(t.id==='emoIn'&&SH.st.ed){if(e.isComposing)return;var gx=lastGrapheme(t.value);if(gx){SH.st.ed.emoji=gx;SH.st.ed.photo='';if(t.value!==gx)t.value=gx}return}
 if(t.id==='pq'){var q=(t.value||'').trim().toLowerCase();$$('[data-ingadd],[data-pedit]').forEach(function(b){b.hidden=!!q&&b.dataset.pname.indexOf(q)<0});return}
 if(t.dataset.b){setP(st,t.dataset.b,t.value);if(t.dataset.b.indexOf('ed.ings.')===0)updIngs()}
 else if(t.dataset.bm){st.w[t.dataset.bm]=t.value;refreshGym(t.dataset.bm)}
 else if(t.id==='tIni'||t.id==='tFin'){var p=(t.value||'').split(':');if(p.length>=2&&p[0]!==''){var mm=(+p[0])*60+(+p[1]);if(!isNaN(mm)){if(t.id==='tIni')st.ini=mm;else st.fin=mm;updateRing()}}}
});
document.addEventListener('change',function(e){
 var t=e.target;
 if(t.id==='shDay'&&SH){setDay(t.value);return}
 if(t.id==='selMuscle'){muscle=t.value;renderCharts();return}
 if(t.id==='cFrom'||t.id==='cTo'){
  var v0=t.value;if(!v0)return;var tdy=today();if(v0>tdy)v0=tdy;
  if(t.id==='cFrom'){rFrom=v0;if(rTo<rFrom)rTo=rFrom}else{rTo=v0;if(rFrom>rTo)rFrom=rTo}
  if(dayRange(rFrom,rTo).length>366){var d0=parseKey(rTo);d0.setDate(d0.getDate()-365);rFrom=dk(d0)}
  renderCharts();return}
 if(t.id==='hFrom'||t.id==='hTo'){
  var hv=t.value,tdh=today();if(hv>tdh)hv=tdh;
  if(t.id==='hFrom'){hFrom=hv;if(hv&&hTo&&hTo<hv)hTo=hv}else{hTo=hv;if(hv&&hFrom&&hFrom>hv)hFrom=hv}
  renderHist();return}
 var gm={s_kcal:'kcal',s_p:'p',s_c:'c',s_g:'g',s_meta:'ml'};
 if(gm[t.id]){var v=+t.value;if(v>0){db.goals[gm[t.id]]=v;persist();renderHoy()}return}
 if(t.id==='s_vaso'){var vv=+t.value;if(vv>0){db.vasoMl=vv;persist();renderHoy()}return}
 if(t.id==='impFile'&&t.files&&t.files[0]){var fr=new FileReader();fr.onload=function(){$('#impTxt').value=String(fr.result||'')};fr.readAsText(t.files[0]);return}
 if(t.id==='photoIn'&&t.files&&t.files[0]&&SH&&SH.st.ed){
  var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){
   var cv=document.createElement('canvas'),S=160;cv.width=S;cv.height=S;var cx=cv.getContext('2d'),m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2;
   cx.drawImage(im,sx,sy,m,m,0,0,S,S);
   try{SH.st.ed.photo=cv.toDataURL('image/jpeg',0.72);SH.st.ed.emoji=SH.st.ed.emoji||'🍽️'}catch(_){SH.st.err='No pude usar esa foto.'}
   drawSheet()};im.onerror=function(){SH.st.err='No pude abrir esa imagen.';drawSheet()};im.src=String(rd.result)};
  rd.readAsDataURL(t.files[0])}
});

 var t=e.target;if((e.key==='Enter'||e.key===' ')&&t&&t.getAttribute&&t.getAttribute('role')==='button'&&t.dataset.open){e.preventDefault();openSheet(t.dataset.open)}

showTab('hoy');
